<style>
:root{

  --indigo:#4f46e5; --indigo-2:#6d5ef0; --indigo-soft:#eef0ff;
}
:root[data-theme="dark"]{
  --bg:#0f1220; --card:#171b2e; --line:#2a3050;
  --text:#e7e9f5; --muted:#9aa3c0; --faint:#6b7395;
  --indigo-soft:#232a55;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}
a{color:inherit}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid #7c6cff;outline-offset:2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:50;height:64px;background:linear-gradient(180deg,#182039,#121a2f);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--navy-line);box-shadow:0 8px 24px -16px rgba(10,14,30,.8)}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;position:relative}
.icon-btn:hover{background:var(--navy-2)}
.logo{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(124,108,255,.8)}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand b{color:#ff5a5f;font-weight:800}
.crumb{color:#dfe4f3;font-weight:600;margin-left:8px;padding-left:14px;border-left:1px solid var(--navy-line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.badge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:8px;background:#e5484d;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6d5ef0,#d9243a);font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px #1c2640,0 0 0 3px #3a4670}

/* ---------- shell + sidebar ---------- */
.shell{display:flex;height:calc(100vh - 64px)}
.side{width:264px;flex:none;background:linear-gradient(180deg,#141c31,#10172b);color:#c9d1e6;padding:16px 12px;height:100%;overflow:auto;display:flex;flex-direction:column;gap:2px}
.shell.side-off .side{display:none}
.nav-h{font-size:12px;color:#7f8bab;padding:6px 14px 8px;font-weight:600}
.side button.nav{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;font-weight:500;color:#c9d1e6;position:relative;transition:background .15s;width:100%}
.side button.nav:hover{background:var(--navy-2)}
.side button.nav[aria-current="page"]{background:linear-gradient(90deg,#43214a,#2b1c3f);color:#fff;box-shadow:inset 0 0 0 1px #6b2140;font-weight:600}
.side button.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#ff5a6a,#7c6cff)}
.side button.nav[aria-current="page"] .ic{color:#ff5a6a}
.pro-box{margin-top:auto;border:1px solid #6e5a1c;background:linear-gradient(160deg,#1d1f24,#141821);border-radius:16px;padding:16px;font-size:13px;line-height:1.45}
.pro-box h4{color:#f3c23c;display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:6px}
.pro-box a{display:inline-block;margin-top:10px;border:1px solid #f3c23c;color:#f3c23c;padding:8px 14px;border-radius:10px;font-weight:600;text-decoration:none;font-size:14px}
.pro-box a:hover{background:#f3c23c22}

/* ---------- content frames ---------- */
.content{flex:1;min-width:0;position:relative;height:100%}
.content iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}
.content iframe.active{display:block}

@media (max-width:900px){
  .side{position:fixed;left:0;top:64px;z-index:45;transform:translateX(-100%);transition:transform .2s;box-shadow:none;width:264px}
  .shell.side-off .side{display:flex}
  .side.open{transform:none;box-shadow:12px 0 40px -12px rgba(0,0,0,.6)}
}
@media (max-width:520px){
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

.ring{--v:0;--c:var(--indigo);--s:56px;--in:6px;--rb:#fff;width:var(--s);height:var(--s);border-radius:50%;background:conic-gradient(var(--c) calc(var(--v) * 1%),#e9ebf5 0);display:grid;place-items:center;position:relative;flex:none}

.bt{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bt-text{flex:1;min-width:170px}
.preset.booster .pi{width:56px;height:56px;background:linear-gradient(135deg,#ff5a6a,#d9243a);color:#fff;box-shadow:0 10px 20px -8px rgba(217,36,58,.9)}

.preset.booster:hover .b-cta{background:#f1efff}

/* ---------- builder ---------- */
.builder{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--sh-2)}
.form{padding:28px 30px 30px;display:flex;flex-direction:column;gap:22px}
.form-head{display:flex;gap:14px;align-items:center}
.gen-ic{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#6d5ef0,#4f46e5);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 12px 22px -10px rgba(79,70,229,.9)}
.form-head h2{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.form-head p{color:var(--muted);font-size:14px}
.form-head .grow{flex:1;min-width:0}
.link{color:var(--indigo);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none}
.link:hover{background:var(--indigo-soft)}
.link[hidden]{display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{display:block;font-size:13px;font-weight:600;color:#3a425a;margin-bottom:6px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:48px;padding:0 40px 0 14px;border:1px solid var(--line);border-radius:12px;background:#fbfbfe;font-weight:600;font-size:14.5px;text-overflow:ellipsis;transition:border-color .15s,box-shadow .15s}
.sel .ic{position:absolute;right:14px;top:16px;width:16px;height:16px;color:var(--faint);pointer-events:none}
.sel select:hover:not(:disabled){border-color:#c4c8dc}
.sel select:focus-visible{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.15);outline:0}
.sel select:disabled{color:var(--faint);background:#f3f4f9;cursor:not-allowed;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;color:#3a425a;display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.chip:hover{border-color:#b9b4ff}
.chip[aria-pressed=&quot;true&quot;]{background:var(--indigo);border-color:var(--indigo);color:#fff;box-shadow:0 8px 16px -8px rgba(79,70,229,.9)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:#eff0f8;border-radius:14px;padding:4px;gap:4px}
.seg button{height:40px;border-radius:10px;font-weight:600;font-size:14px;color:#4b5470;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=&quot;true&quot;]{background:#fff;color:var(--text);box-shadow:0 2px 6px rgba(20,28,49,.16)}
.settings{display:grid;grid-template-columns:1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;width:100%;background:#fcfcff}
.toggle:hover{border-color:#c4c8dc}
.toggle b{display:block;font-size:14px;line-height:1.3}
.toggle small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block;margin-top:2px}
.sw{width:42px;height:25px;border-radius:13px;background:#cfd3e2;position:relative;flex:none;transition:background .15s}
.sw::after{content:&quot;&quot;;position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.toggle[aria-checked=&quot;true&quot;] .sw{background:var(--indigo)}
.toggle[aria-checked=&quot;true&quot;] .sw::after{transform:translateX(17px)}

/* ---------- live preview ---------- */
.preview{background:radial-gradient(120% 90% at 100% 0,rgba(217,36,58,.28) 0,transparent 55%),radial-gradient(100% 80% at 0 100%,rgba(82,54,217,.4) 0,transparent 60%),var(--navy);color:#fff;padding:28px;display:flex;flex-direction:column;gap:20px}
.preview.flash{animation:flash .7s ease-out}
@keyframes flash{0%{box-shadow:inset 0 0 0 3px #7c6cff}100%{box-shadow:inset 0 0 0 3px transparent}}
.pv-title{color:#aab4d0;font-size:14px;font-weight:600}
.big{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.big output{font-size:48px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big span{color:#c9d1e6;font-size:20px;font-weight:700}
.pv-sub{color:#aab4d0;font-size:13.5px;margin-top:8px;line-height:1.45}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#2a3553;gap:2px}
.mix i{display:block;flex:1 1 0;min-width:0;transition:flex-grow .3s}
.mix .e{background:var(--easy)}
.mix .m{background:var(--med)}
.mix .h{background:var(--hard)}
.legend{display:flex;gap:16px;font-size:13px;color:#c9d1e6;margin-top:10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:#fff;font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);border-radius:14px;overflow:hidden}
.facts div{background:rgba(20,28,49,.85);padding:12px 14px}
.facts small{display:block;color:#8f9bbb;font-size:12px}
.facts b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:rgba(255,255,255,.1);color:#d6dcf0;font-size:12.5px;padding:4px 10px;border-radius:999px}
.warn{background:#3a2330;border:1px solid #6b2a3c;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#ffd3d8;line-height:1.45}
.warn[hidden]{display:none}
.warn button{color:#fff;font-weight:700;text-decoration:underline;padding:0}
.start{margin-top:auto;height:56px;border-radius:15px;background:var(--grad);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 16px 30px -14px rgba(217,36,58,.9);text-align:center}
.start:hover:not(:disabled){filter:brightness(1.1)}
.start:disabled{background:#2a3553;color:#7f8bab;box-shadow:none;cursor:not-allowed}

/* ---------- lower panels ---------- */
.lower{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 24px;box-shadow:var(--sh-1)}
.weak,.recent{list-style:none;padding:0}
.weak{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:border-color .15s,box-shadow .15s,transform .15s}
.wk:hover{border-color:#b9b4ff;box-shadow:0 14px 26px -16px rgba(79,70,229,.65);transform:translateY(-1px)}
.wk .ring{--s:52px;--in:6px}
.wk b{display:block;font-size:14.5px;line-height:1.35}
.wk small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.wk-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.go{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;background:var(--indigo-soft);color:var(--indigo);font-weight:700;font-size:13.5px;white-space:nowrap;transition:background .15s,color .15s}
.wk:hover .go{background:var(--indigo);color:#fff}
.plan{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.plan.f{background:#fde8e9;color:#b32a30}
.plan.b{background:#fff2d3;color:#8a5a00}
.plan.c{background:#e5f6ee;color:#17784f}
.btn-sm{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13.5px;background:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-sm:hover{border-color:var(--indigo);color:var(--indigo)}
.recent li{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.recent li:first-child{border-top:0}
.recent b{display:block;font-size:14.5px;line-height:1.35}
.recent small{color:var(--muted);font-size:13px}
.score{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.acc{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.acc.good{background:#e5f6ee;color:#17784f}
.acc.mid{background:#fff2d3;color:#8a5a00}
.acc.low{background:#fde8e9;color:#b32a30}

/* ---------- coverage ---------- */
.cov-top{display:flex;align-items:center;gap:14px}
.cov-top .ring{--s:44px;--in:5px;--c:var(--indigo)}
.cov{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cov-row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center}
.cov-row &gt; span{font-weight:700;font-size:12.5px}
.cells{display:flex;flex-wrap:wrap;gap:8px}
.cell{--p:0;flex:1 1 130px;max-width:200px;padding:7px 10px;border-radius:10px;border:1px solid #d3d6f2;background:linear-gradient(90deg,#d6d2ff calc(var(--p) * 1%),#f5f6fc calc(var(--p) * 1%));transition:border-color .15s,transform .15s,box-shadow .15s}
.cell:hover{border-color:var(--indigo);transform:translateY(-1px);box-shadow:0 10px 20px -14px rgba(79,70,229,.8)}
.cell.zero{border-style:dashed;background:#fff}
.cell b{display:block;font-size:12px;line-height:1.25}
.cell small{font-size:11px;color:var(--muted)}
.cov-note{font-size:12px;color:var(--muted);margin-top:12px}

/* ---------- PRO teaser ---------- */
.tease{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:linear-gradient(120deg,#fffdf6,#fff7e0);border:1px solid #efd9a0;border-radius:22px;padding:22px 24px;box-shadow:var(--sh-1)}
.tease h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.015em}
.pro-tag{font-size:11px;font-weight:800;background:#f3c23c;color:#4a3300;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.tease p{color:var(--muted);font-size:13.5px;margin-top:2px}
.blurred{margin-top:12px;display:flex;flex-direction:column;gap:8px;filter:blur(4.5px);user-select:none;pointer-events:none;max-width:560px}
.blurred div{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600}
.blurred i{width:8px;height:8px;border-radius:50%;background:var(--hard);flex:none}
.tease .cta{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:13.5px;color:var(--muted);min-width:180px}
.tease .lock{width:46px;height:46px;border-radius:50%;background:#fff6dd;color:#a86d0a;display:grid;place-items:center;box-shadow:0 8px 18px -10px rgba(168,109,10,.8)}
.btn.gold{background:#141c31;color:#f3c23c}
.btn.gold:hover{background:#1c2640}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;font-weight:600;font-size:14px;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   TEST POPUP
   ============================================================ */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px}
.modal[hidden]{display:none}
.m-back{position:absolute;inset:0;background:rgba(9,13,28,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.m-card{position:relative;width:min(1060px,100%);height:min(800px,100%);background:#fff;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:center;gap:14px;padding:16px 20px;color:#fff;background:radial-gradient(90% 200% at 100% 0,rgba(217,36,58,.4) 0,transparent 60%),linear-gradient(120deg,#141c31 0%,#241c4a 65%,#33193c 100%)}
.m-ic{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#ff5a6a,#d9243a);display:grid;place-items:center;flex:none;box-shadow:0 10px 20px -8px rgba(217,36,58,.9)}
.m-ttl{flex:1;min-width:0}
.m-ttl h3{font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-ttl p{font-size:13px;color:#b9c3e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-timer{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:7px 12px;font-size:12.5px;color:#d6dcf0;flex:none}
.m-timer b{font-size:16px;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.m-timer.low{background:#5a1f2c;border-color:#a1394c;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
.m-x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.m-x:hover{background:rgba(255,255,255,.14)}
.m-prog{height:4px;background:#e9ebf5;flex:none}
.m-prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}

/* ---------- PRO modal ---------- */
.pro-card{position:relative;width:min(480px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.pro-x{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12)}
.pro-x:hover{background:rgba(255,255,255,.22)}
.pro-head{padding:32px 28px 20px;text-align:center;color:#fff;background:radial-gradient(90% 160% at 100% 0,rgba(217,36,58,.4) 0,transparent 60%),radial-gradient(90% 160% at 0 0,rgba(82,54,217,.35) 0,transparent 60%),linear-gradient(150deg,#141c31 0%,#241c4a 65%,#33193c 100%)}
.pro-crown{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#ffce54,#f5a623);display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 12px 24px -10px rgba(245,166,35,.9)}
.pro-crown svg{width:28px;height:28px;color:#3a2200}
.pro-head h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pro-head p{font-size:13.5px;color:#c9d1e6;margin-top:6px;line-height:1.4}
.pro-body{padding:24px 28px 28px}
.pro-features{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.pro-features li{display:flex;gap:12px;align-items:flex-start}
.pro-features li svg{width:20px;height:20px;color:#1b8a5b;flex:none;margin-top:1px}
.pro-features b{display:block;font-size:14px;font-weight:700}
.pro-features small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px;line-height:1.4}
.pro-plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.pro-plan{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff;transition:border-color .15s,background .15s}
.pro-plan.active{border-color:#f5a623;background:#fffaf0}
.pp-badge{position:absolute;top:-10px;left:12px;font-size:10px;font-weight:800;background:#f5a623;color:#3a2200;padding:2px 8px;border-radius:999px}
.pp-t{font-size:13px;color:var(--muted);font-weight:600}
.pp-p{font-size:20px;font-weight:800;letter-spacing:-.02em}
.pp-p small{font-size:12px;font-weight:600;color:var(--muted)}
.pp-sub{font-size:11.5px;color:#a86d0a;font-weight:600;margin-top:2px}
.pro-cta{width:100%;height:48px;font-size:15px}
.pro-note{text-align:center;font-size:12px;color:var(--muted);margin-top:12px}
.m-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 270px}
.m-body.result{grid-template-columns:minmax(0,1fr)}
.m-main{overflow:auto;padding:26px 30px}
.m-side{border-left:1px solid var(--line);background:#fafbff;overflow:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
.m-body.result .m-side{display:none}
.m-foot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fff;flex:none;flex-wrap:wrap}
.m-foot .grow{flex:1}
.mb{height:44px;padding:0 20px;border-radius:12px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.mb.ghost{border:1px solid var(--line);background:#fff;color:#3a425a}
.mb.ghost:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}
.mb.ghost[aria-pressed=&quot;true&quot;]{background:#fff6dd;border-color:#f0cf7a;color:#8a5a00}
.mb.solid{background:var(--indigo);color:#fff;box-shadow:0 12px 22px -12px rgba(79,70,229,.9)}
.mb.solid:hover{background:#4038c9}
.mb.grad{background:var(--grad);color:#fff;box-shadow:0 14px 26px -14px rgba(217,36,58,.9)}
.mb.grad:hover{filter:brightness(1.08)}
.mb:disabled{opacity:.45;cursor:not-allowed}

.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.qn{font-weight:800;font-size:14px;margin-right:4px}
.pill{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:#f0f1f8;color:#4b5470;display:inline-flex;align-items:center;gap:6px}
.pill.easy{background:#e5f6ee;color:#17784f}.pill.easy .dot{background:var(--easy)}
.pill.med{background:#fff2d3;color:#8a5a00}.pill.med .dot{background:var(--med)}
.pill.hard{background:#fde8e9;color:#b32a30}.pill.hard .dot{background:var(--hard)}
.q-text{font-size:19px;line-height:1.5;font-weight:700;letter-spacing:-.01em;margin-bottom:12px;outline:0}
.stmts{list-style:none;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.stmts li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:15.5px;line-height:1.5;padding:10px 14px;background:#f7f8fd;border:1px solid var(--line);border-radius:12px}
.stmts li::before{content:counter(st) &quot;.&quot;;font-weight:800;color:var(--indigo)}
.q-ask{font-weight:600;font-size:15.5px;margin-bottom:14px;color:#2b3350}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:500;font-size:15px;line-height:1.45;transition:border-color .12s,background .12s,box-shadow .12s}
.opt:hover:not([aria-disabled=&quot;true&quot;]){border-color:#b9b4ff;background:#fafaff}
.opt[aria-disabled=&quot;true&quot;]{cursor:default}
.ol{width:30px;height:30px;border-radius:9px;background:#f0f1f8;color:#4b5470;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.opt.sel{border-color:var(--indigo);background:var(--indigo-soft);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.opt.sel .ol{background:var(--indigo);color:#fff}
.opt.right{border-color:var(--easy);background:#eaf8f1}
.opt.right .ol{background:var(--easy);color:#fff}
.opt.wrong{border-color:var(--hard);background:#fdeeee}
.opt.wrong .ol{background:var(--hard);color:#fff}
.opt.dim{opacity:.55}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;font-size:14.5px;line-height:1.55;border:1px solid;animation:fbIn .22s ease-out}
@keyframes fbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fb.ok{background:#eaf8f1;border-color:#bfe7d2;color:#14563a}
.fb.no{background:#fff3f3;border-color:#f6c9cc;color:#7f2226}
.fb b{display:block;font-size:15px;margin-bottom:2px}

.side-h{font-size:13px;font-weight:700;color:#3a425a;margin-bottom:10px}
.plan-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.plan-box .pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.plan-box .pr:first-of-type{border-top:0;padding-top:2px}
.plan-box .pr b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plan-box .pr small{grid-column:1/-1;color:var(--muted);font-size:12px;line-height:1.4}
.plan-box p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:6px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pn{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;position:relative;color:#4b5470}
.pn:hover{border-color:#b9b4ff}
.pn.ans{background:var(--indigo-soft);border-color:#c4beff;color:var(--indigo)}
.pn.ok{background:#e5f6ee;border-color:#a8dcc3;color:#17784f}
.pn.no{background:#fde8e9;border-color:#f3b7bb;color:#b32a30}
.pn.cur{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.2);color:var(--text)}
.pn.flag::after{content:&quot;&quot;;position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:#f3c23c;border:2px solid #fafbff}
.tally{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tally div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tally small{display:block;color:var(--muted);font-size:12px}
.tally b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.tally .g b{color:var(--easy)}.tally .r b{color:var(--hard)}

.m-confirm{position:absolute;inset:0;z-index:5;background:rgba(9,13,28,.55);display:grid;place-items:center;padding:20px}
.m-confirm[hidden]{display:none}
.m-cbox{background:#fff;border-radius:20px;padding:24px;width:min(420px,100%);box-shadow:var(--sh-2);animation:pop .2s ease-out}
.m-cbox h4{font-size:18px;font-weight:800;letter-spacing:-.01em}
.m-cbox p{color:var(--muted);font-size:14.5px;margin:6px 0 18px;line-height:1.5}
.m-cbox .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* result */
.res{display:flex;flex-direction:column;gap:22px;max-width:820px;margin:0 auto}
.res-hero{display:flex;align-items:center;gap:22px;padding:22px;border-radius:20px;background:linear-gradient(110deg,#eceeff,#fff0f2)}
.res-hero .ring{--s:110px;--in:11px;--rb:#f6f3ff}
.res-hero .ring b{font-size:24px}
.res-hero h3{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.res-hero p{color:var(--muted);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff}
.tile small{display:block;color:var(--muted);font-size:12.5px}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tile.g b{color:var(--easy)}.tile.r b{color:var(--hard)}
.res h4{font-size:16px;font-weight:800;margin-bottom:10px}
.delta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.delta + .delta{margin-top:10px}
.delta b{font-size:14.5px}
.delta .arrow{font-weight:800;font-variant-numeric:tabular-nums}
.delta .arrow.up{color:var(--easy)}.delta .arrow.dn{color:var(--hard)}
.delta small{grid-column:1/-1;color:var(--muted);font-size:13px}
.rev details{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.rev details + details{margin-top:8px}
.rev summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;font-weight:600;font-size:14px}
.rev summary::-webkit-details-marker{display:none}
.rev summary span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rev .st{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff}
.rev .st.ok{background:var(--easy)}.rev .st.no{background:var(--hard)}.rev .st.sk{background:#9aa3ba}
.rev .st .ic{width:14px;height:14px;stroke-width:3}
.rev .rb{padding:0 14px 14px;font-size:14px;line-height:1.55;color:#2b3350}
.rev .rb p + p{margin-top:6px}
.rev .rb em{font-style:normal;font-weight:700}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .presets{grid-template-columns:repeat(2,1fr)}
  .preset.booster{grid-column:1/-1}
  .builder{grid-template-columns:minmax(0,1fr)}
  .lower{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .side{position:fixed;left:0;top:64px;z-index:45;transform:translateX(-100%);transition:transform .2s;box-shadow:none}
  .shell.side-off .side{display:flex}
  .side.open{transform:none;box-shadow:12px 0 40px -12px rgba(0,0,0,.6)}
  main{padding:20px 16px 56px}
  .tease{grid-template-columns:minmax(0,1fr)}
  .tease .cta{align-items:flex-start;text-align:left}
}
@media (max-width:720px){
  .modal{padding:0;align-items:end}
  .m-card{height:96dvh;width:100%;border-radius:24px 24px 0 0}
  .m-body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .m-side{order:-1;border-left:0;border-bottom:1px solid var(--line);padding:10px 14px;gap:0;overflow:visible}
  .m-side .plan-box,.m-side .side-h,.m-side .tally{display:none}
  .pal{display:flex;overflow-x:auto;gap:8px;padding:4px 2px}
  .pn{width:38px;flex:none}
  .m-main{padding:20px 18px}
  .m-timer span{display:none}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .res-hero{flex-direction:column;text-align:center}
  .mb{padding:0 14px}
}
@media (max-width:600px){
  .grid2,.settings{grid-template-columns:minmax(0,1fr)}
  .seg{grid-template-columns:repeat(2,1fr)}
  .presets{grid-template-columns:minmax(0,1fr)}
  .form{padding:20px 18px 22px}
  .preview{padding:22px 18px}
  .form-head{flex-wrap:wrap}
  .cov-row{grid-template-columns:1fr;gap:6px}
  .crumb{display:none}
  h1{font-size:20px}
  .head p{font-size:13px}
  .recent li{grid-template-columns:1fr auto}
  .recent .acc{display:none}
  .wk{grid-template-columns:auto minmax(0,1fr)}
  .wk-r{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .preset.booster .pi{width:44px;height:44px}
  .preset.booster .pi svg{width:22px;height:22px}
  .bt{gap:12px}
  .bt-text{min-width:140px}
  .preset.booster b{font-size:16px}
  .pro-head{padding:26px 20px 18px}
  .pro-body{padding:20px 20px 22px}
  .pro-plans{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function pool(){
  const k = SCALE * EXAMS[S.exam].f * (S.year === &#x27;all&#x27; ? 1 : yearF(+S.year));
  const t = [0,0,0];
  for (const [sub, topics] of Object.entries(BANK)){
    if (S.subject !== &#x27;all&#x27; &amp;&amp; S.subject !== sub) continue;
    for (const [top, subs] of Object.entries(topics)){
      if (S.topic !== &#x27;all&#x27; &amp;&amp; S.topic !== top) continue;
      for (const [st, c] of Object.entries(subs)){
        if (S.subtopic !== &#x27;all&#x27; &amp;&amp; S.subtopic !== st) continue;
        c.forEach((v, i) =&gt; { if (S.diff === &#x27;all&#x27; || DIFFS[i] === S.diff) t[i] += Math.round(v * k); });
      }
    }
  }
  return t;
}

function fillSelect(id, items, allLabel, value, lockedMsg){
  const el = $(id);

  el.disabled = locked;
  el.value = locked ? &#x27;all&#x27; : value;
}

/* count-up tween for the big number */
let shown = 0, raf = 0;
function tween(to){
  cancelAnimationFrame(raf);
  const out = $(&#x27;#count&#x27;);
  if (reduceMotion){ shown = to; out.textContent = to; return; }
  const from = shown, t0 = performance.now();
  (function step(now){
    const p = Math.min(1, (now - t0) / 280);
    shown = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    out.textContent = shown;
    if (p &lt; 1) raf = requestAnimationFrame(step);
  })(t0);
}

  fillSelect(&#x27;#year&#x27;, YEARS.map(y =&gt; ({ v:y, l:y })), &#x27;All years&#x27;, S.year);

  /* numbers */
  const t = pool();
  const total = t[0] + t[1] + t[2];

  });
  $(&#x27;#ne&#x27;).textContent = e; $(&#x27;#nm&#x27;).textContent = m; $(&#x27;#nh&#x27;).textContent = h;

  $(&#x27;#fTime&#x27;).textContent = !n ? &#x27;-&#x27; : S.timed ? Math.max(1, Math.round(n * 1.2)) + &#x27; min&#x27; : &#x27;No limit&#x27;;
  $(&#x27;#fMarks&#x27;).textContent = n ? n * 2 : &#x27;-&#x27;;
  $(&#x27;#fMark&#x27;).textContent = S.neg ? &#x27;+2 / \u22120.67&#x27; : &#x27;+2 / 0&#x27;;
  $(&#x27;#fDiff&#x27;).textContent = S.diff === &#x27;all&#x27; ? &#x27;Mixed&#x27; : S.diff[0].toUpperCase() + S.diff.slice(1);

  /* filter tags */

  if (S.exam !== &#x27;all&#x27;) tags.push(EXAMS[S.exam].label);
  if (S.year !== &#x27;all&#x27;) tags.push(S.year);
  if (S.subject !== &#x27;all&#x27;) tags.push(S.subject);
  if (S.topic !== &#x27;all&#x27;) tags.push(S.topic);
  if (S.subtopic !== &#x27;all&#x27;) tags.push(S.subtopic);

  /* empty state + start button */

}

/* ============================================================
   ADAPTIVE WEAK-AREA ENGINE
   The lower your accuracy, the easier the test starts.
   ============================================================ */
const accOf = w =&gt; Math.round(w.right / w.done * 100);
const accCol = p =&gt; p &lt; 50 ? &#x27;var(--hard)&#x27; : p &lt; 65 ? &#x27;var(--med)&#x27; : &#x27;var(--easy)&#x27;;

function planFor(acc){
  if (acc &lt; 50) return { key:&#x27;f&#x27;, name:&#x27;Foundation&#x27;, mix:[.6,.3,.1],  line:&#x27;Starts with easy questions to rebuild the basics.&#x27; };
  if (acc &lt; 65) return { key:&#x27;b&#x27;, name:&#x27;Build-up&#x27;,   mix:[.3,.5,.2],  line:&#x27;Mostly medium questions with a few stretch ones.&#x27; };
  return            { key:&#x27;c&#x27;, name:&#x27;Challenge&#x27;,  mix:[.1,.4,.5],  line:&#x27;Harder questions to push you past the plateau.&#x27; };
}

function shuffle(a){
  for (let i = a.length - 1; i &gt; 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* split a total into [easy, medium, hard] counts using largest remainder */
function split(total, mix){
  const raw = mix.map(m =&gt; m * total), base = raw.map(Math.floor);
  let left = total - base.reduce((a, b) =&gt; a + b, 0);
  raw.map((r, i) =&gt; [r - base[i], i]).sort((a, b) =&gt; b[0] - a[0]).forEach(([, i]) =&gt; { if (left &gt; 0){ base[i]++; left--; } });
  return base;
}

function pickFor(sub, top, n, mix){
  const poolQ = QB.filter(x =&gt; x.sub === sub &amp;&amp; x.top === top);
  const cap = Math.min(n, poolQ.length);
  const buckets = [0,1,2].map(d =&gt; shuffle(poolQ.filter(x =&gt; x.d === d)));
  const want = split(cap, mix), out = [];
  buckets.forEach((b, d) =&gt; out.push(...b.splice(0, want[d])));
  const target = mix[1] + 2 * mix[2];
  const rest = buckets.flat().sort((a, b) =&gt; Math.abs(a.d - target) - Math.abs(b.d - target));
  out.push(...rest.slice(0, cap - out.length));
  return out;
}

function launchBooster(list){
  const single = list.length === 1;
  const N = single ? (accOf(list[0]) &lt; 50 ? 10 : 8) : 12;
  /* weaker topics get more questions (D&#x27;Hondt style, weighted by how far below 100% you are) */
  const al = list.map(w =&gt; ({ w, n:0, cap:QB.filter(x =&gt; x.sub === w.subject &amp;&amp; x.top === w.topic).length, wt:Math.pow(100 - accOf(w), 2) }));
  for (let i = 0; i &lt; N; i++){
    const c = al.filter(a =&gt; a.n &lt; a.cap).sort((a, b) =&gt; b.wt / (b.n + 1) - a.wt / (a.n + 1))[0];
    if (!c) break; c.n++;
  }
  const qs = [];
  al.forEach(a =&gt; qs.push(...pickFor(a.w.subject, a.w.topic, a.n, planFor(accOf(a.w)).mix)));
  if (!qs.length){ toast(&#x27;No practice questions are loaded for this topic yet.&#x27;); return; }
  shuffle(qs); qs.sort((a, b) =&gt; a.d - b.d);   /* warm up on easy, finish on hard */

  const w0 = list[0], p0 = planFor(accOf(w0));
  startTest({
    kind: single ? &#x27;focus&#x27; : &#x27;booster&#x27;,
    title: single ? `${w0.topic} booster` : &#x27;Weak area booster&#x27;,
    sub: single ? `${p0.name} plan, based on your ${accOf(w0)}% accuracy` : `Built from your ${list.length} weakest topics, weakest first`,
    qs, mode:&#x27;learn&#x27;, neg:false,
    plan: list.map(w =&gt; ({ name:`${w.subject}: ${w.topic}`, acc:accOf(w), p:planFor(accOf(w)) })),
    again: () =&gt; launchBooster(list)
  });
}

function launchBuilder(){
  const dIdx = S.diff === &#x27;all&#x27; ? null : DIFFS.indexOf(S.diff);
  let qs = QB.filter(x =&gt;
    (S.subject === &#x27;all&#x27; || x.sub === S.subject) &amp;&amp;
    (S.topic === &#x27;all&#x27; || x.top === S.topic) &amp;&amp;
    (dIdx === null || x.d === dIdx));
  if (!qs.length){ toast(&#x27;This sample bank has questions for Fundamental Rights, Inflation and Indian Physical only.&#x27;); return; }
  qs = shuffle(qs.slice()).slice(0, S.size).sort((a, b) =&gt; a.d - b.d);
  startTest({
    kind:&#x27;custom&#x27;,
    title: S.topic !== &#x27;all&#x27; ? S.topic : S.subject !== &#x27;all&#x27; ? S.subject : &#x27;Practice test&#x27;,
    sub: S.timed ? &#x27;Timed test&#x27; + (S.neg ? &#x27; with negative marking&#x27; : &#x27;&#x27;) : &#x27;Untimed practice with instant answers&#x27;,
    qs, mode: S.timed ? &#x27;exam&#x27; : &#x27;learn&#x27;, neg: S.neg, plan:null,
    again: launchBuilder
  });
}

function startTest(cfg){
  const n = cfg.qs.length;
  const secs = Math.round(n * 72);          /* 1.2 minutes per question */
  T = {
    ...cfg, n, done:false,
    ans:  cfg.ans  || Array(n).fill(null),
    flag: cfg.flag || Array(n).fill(false),
    locked: Array(n).fill(false),
    idx:  cfg.idx || 0,
    total: secs,
    left:  cfg.left != null ? cfg.left : secs,
    elapsed: cfg.left != null ? secs - cfg.left : 0
  };
  if (T.mode === &#x27;learn&#x27;) T.ans.forEach((a, i) =&gt; { T.locked[i] = a != null; });

  $(&#x27;#mTitle&#x27;).textContent = T.title;
  $(&#x27;#mSub&#x27;).textContent = T.sub;
  $(&#x27;#mTimeLbl&#x27;).textContent = T.mode === &#x27;exam&#x27; ? &#x27;Time left&#x27; : &#x27;Time&#x27;;
  M.wrap.classList.remove(&#x27;result&#x27;);
  M.modal.hidden = false;
  document.body.classList.add(&#x27;lock&#x27;);
  lastFocus = document.activeElement;
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  paintTimer();
  renderTest(&#x27;q&#x27;);
}

function fmt(s){ s = Math.max(0, s); return String(Math.floor(s / 60)).padStart(2, &#x27;0&#x27;) + &#x27;:&#x27; + String(s % 60).padStart(2, &#x27;0&#x27;); }

function paintTimer(){
  const exam = T.mode === &#x27;exam&#x27;;
  $(&#x27;#mTime&#x27;).textContent = fmt(exam ? T.left : T.elapsed);
  $(&#x27;#mTimer&#x27;).classList.toggle(&#x27;low&#x27;, exam &amp;&amp; T.left &lt;= 60 &amp;&amp; !T.done);
}

function tick(){
  if (!T || T.done) return;
  T.elapsed++;
  if (T.mode === &#x27;exam&#x27;){
    T.left--;
    if (T.left &lt;= 0){ T.left = 0; paintTimer(); toast(&#x27;Time is up. Your test was submitted.&#x27;); finish(); return; }
  }
  paintTimer();
}

function counts(){
  let c = 0, w = 0, s = 0;
  T.qs.forEach((Q, i) =&gt; { if (T.ans[i] == null) s++; else if (T.ans[i] === Q.k) c++; else w++; });
  return { c, w, s };
}

function renderTest(focus){
  const i = T.idx, Q = T.qs[i], learn = T.mode === &#x27;learn&#x27;, locked = learn &amp;&amp; T.locked[i], chosen = T.ans[i];
  const dc = [&#x27;easy&#x27;,&#x27;med&#x27;,&#x27;hard&#x27;][Q.d], dl = [&#x27;Easy&#x27;,&#x27;Medium&#x27;,&#x27;Hard&#x27;][Q.d];
  const L = &#x27;ABCD&#x27;;

  let h = `&lt;div class=&quot;q-meta&quot;&gt;&lt;span class=&quot;qn&quot;&gt;Question ${i + 1} of ${T.n}&lt;/span&gt;&lt;span class=&quot;pill&quot;&gt;${esc(Q.sub)}: ${esc(Q.top)}&lt;/span&gt;&lt;span class=&quot;pill ${dc}&quot;&gt;&lt;i class=&quot;dot&quot;&gt;&lt;/i&gt;${dl}&lt;/span&gt;&lt;/div&gt;`;
  h += `&lt;h4 class=&quot;q-text&quot; id=&quot;qText&quot; tabindex=&quot;-1&quot;&gt;${esc(Q.t)}&lt;/h4&gt;`;
  if (Q.s) h += `&lt;ol class=&quot;stmts&quot;&gt;${Q.s.map(s =&gt; `&lt;li&gt;${esc(s)}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;p class=&quot;q-ask&quot;&gt;${esc(Q.a)}&lt;/p&gt;`;
  h += `&lt;div class=&quot;opts&quot; role=&quot;radiogroup&quot; aria-labelledby=&quot;qText&quot;&gt;` + Q.o.map((txt, j) =&gt; {
    let cls = &#x27;opt&#x27;;
    if (locked){ cls += j === Q.k ? &#x27; right&#x27; : chosen === j ? &#x27; wrong&#x27; : &#x27; dim&#x27;; }
    else if (chosen === j) cls += &#x27; sel&#x27;;
    return `&lt;button class=&quot;${cls}&quot; role=&quot;radio&quot; aria-checked=&quot;${chosen === j}&quot; aria-disabled=&quot;${!!locked}&quot; data-opt=&quot;${j}&quot;&gt;&lt;span class=&quot;ol&quot;&gt;${L[j]}&lt;/span&gt;&lt;span&gt;${esc(txt)}&lt;/span&gt;&lt;/button&gt;`;
  }).join(&#x27;&#x27;) + `&lt;/div&gt;`;
  if (locked){
    const ok = chosen === Q.k;
    h += `&lt;div class=&quot;fb ${ok ? &#x27;ok&#x27; : &#x27;no&#x27;}&quot; role=&quot;status&quot;&gt;&lt;b&gt;${ok ? &#x27;Correct&#x27; : &#x27;Not quite. The answer is &#x27; + L[Q.k]}&lt;/b&gt;${esc(Q.e)}&lt;/div&gt;`;
  }
  M.main.innerHTML = h;
  if (focus === &#x27;q&#x27;){ M.main.scrollTop = 0; $(&#x27;#qText&#x27;).focus({ preventScroll:true }); }
  else if (focus != null){ const b = M.main.querySelector(`[data-opt=&quot;${focus}&quot;]`); if (b) b.focus({ preventScroll:true }); }

  /* side panel */
  const { c, w, s } = counts();
  const answered = T.n - s;
  let sd = &#x27;&#x27;;
  if (T.plan){
    sd += `&lt;div class=&quot;plan-box&quot;&gt;&lt;div class=&quot;side-h&quot;&gt;Your adaptive plan&lt;/div&gt;` +
      T.plan.map(p =&gt; `&lt;div class=&quot;pr&quot;&gt;&lt;b&gt;${esc(p.name)}&lt;/b&gt;&lt;span class=&quot;plan ${p.p.key}&quot;&gt;${p.p.name}&lt;/span&gt;&lt;small&gt;${p.acc}% accuracy. ${p.p.line}&lt;/small&gt;&lt;/div&gt;`).join(&#x27;&#x27;) +
      (T.plan.length &gt; 1 ? `&lt;p&gt;Weaker topics get more questions.&lt;/p&gt;` : &#x27;&#x27;) + `&lt;/div&gt;`;
  }
  sd += `&lt;div&gt;&lt;div class=&quot;side-h&quot;&gt;Questions&lt;/div&gt;&lt;div class=&quot;pal&quot;&gt;` + T.qs.map((x, j) =&gt; {
    let cl = &#x27;pn&#x27;;
    if (learn &amp;&amp; T.locked[j]) cl += T.ans[j] === x.k ? &#x27; ok&#x27; : &#x27; no&#x27;;
    else if (T.ans[j] != null) cl += &#x27; ans&#x27;;
    if (T.flag[j]) cl += &#x27; flag&#x27;;
    if (j === i) cl += &#x27; cur&#x27;;
    const st = T.ans[j] == null ? &#x27;not answered&#x27; : learn &amp;&amp; T.locked[j] ? (T.ans[j] === x.k ? &#x27;correct&#x27; : &#x27;wrong&#x27;) : &#x27;answered&#x27;;
    return `&lt;button class=&quot;${cl}&quot; data-go=&quot;${j}&quot; aria-label=&quot;Question ${j + 1}, ${st}${T.flag[j] ? &#x27;, marked for review&#x27; : &#x27;&#x27;}&quot;${j === i ? &#x27; aria-current=&quot;true&quot;&#x27; : &#x27;&#x27;}&gt;${j + 1}&lt;/button&gt;`;
  }).join(&#x27;&#x27;) + `&lt;/div&gt;&lt;/div&gt;`;
  sd += learn
    ? `&lt;div class=&quot;tally&quot;&gt;&lt;div class=&quot;g&quot;&gt;&lt;small&gt;Correct&lt;/small&gt;&lt;b&gt;${c}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;r&quot;&gt;&lt;small&gt;Wrong&lt;/small&gt;&lt;b&gt;${w}&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`
    : `&lt;div class=&quot;tally&quot;&gt;&lt;div&gt;&lt;small&gt;Answered&lt;/small&gt;&lt;b&gt;${answered}&lt;/b&gt;&lt;/div&gt;&lt;div&gt;&lt;small&gt;Marked&lt;/small&gt;&lt;b&gt;${T.flag.filter(Boolean).length}&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`;
  M.side.innerHTML = sd;

  /* footer */
  const last = i === T.n - 1;
  const nextLbl = last ? &#x27;Finish test&#x27; : (learn &amp;&amp; !locked ? &#x27;Skip&#x27; : &#x27;Next&#x27;);
  let f = `&lt;button class=&quot;mb ghost&quot; data-act=&quot;prev&quot; ${i === 0 ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-left&quot;/&gt;&lt;/svg&gt;Previous&lt;/button&gt;`;
  if (!learn){
    f += `&lt;button class=&quot;mb ghost&quot; data-act=&quot;flag&quot; aria-pressed=&quot;${T.flag[i]}&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-flag&quot;/&gt;&lt;/svg&gt;${T.flag[i] ? &#x27;Marked&#x27; : &#x27;Mark for review&#x27;}&lt;/button&gt;`;
    f += `&lt;button class=&quot;mb ghost&quot; data-act=&quot;clear&quot; ${chosen == null ? &#x27;disabled&#x27; : &#x27;&#x27;}&gt;Clear&lt;/button&gt;`;
  }
  f += `&lt;span class=&quot;grow&quot;&gt;&lt;/span&gt;`;
  f += last
    ? `&lt;button class=&quot;mb grad&quot; data-act=&quot;next&quot;&gt;${nextLbl}&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-check&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;`
    : `&lt;button class=&quot;mb solid&quot; data-act=&quot;next&quot;&gt;${nextLbl}&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-right&quot;/&gt;&lt;/svg&gt;&lt;/button&gt;`;
  M.foot.innerHTML = f;

  $(&#x27;#mProg&#x27;).style.width = (answered / T.n * 100) + &#x27;%&#x27;;
}

function pick(o){
  if (!T || T.done) return;
  const i = T.idx;
  if (T.mode === &#x27;learn&#x27;){
    if (T.locked[i]) return;
    T.ans[i] = o; T.locked[i] = true;
  } else {
    T.ans[i] = T.ans[i] === o ? null : o;
  }
  renderTest(o);
}

function go(j){ if (!T || T.done || j &lt; 0 || j &gt;= T.n) return; T.idx = j; renderTest(&#x27;q&#x27;); }

function next(){
  if (T.idx === T.n - 1) return askFinish();
  go(T.idx + 1);
}

function askFinish(){
  const { s } = counts();
  if (s &gt; 0){
    ask({
      title: &#x27;Finish the test?&#x27;,
      msg: `${s} question${s &gt; 1 ? &#x27;s are&#x27; : &#x27; is&#x27;} not answered and will count as skipped.`,
      no: &#x27;Keep practising&#x27;, yes: &#x27;Finish test&#x27;, cb: finish
    });
  } else finish();
}

/* small in-popup confirm dialog */
function ask({ title, msg, no, yes, cb }){
  $(&#x27;#cTitle&#x27;).textContent = title;
  $(&#x27;#cMsg&#x27;).textContent = msg;
  $(&#x27;#cNo&#x27;).textContent = no;
  $(&#x27;#cYes&#x27;).textContent = yes;
  confirmCb = cb;
  M.conf.hidden = false;
  $(&#x27;#cYes&#x27;).focus();
}
function closeAsk(){ M.conf.hidden = true; confirmCb = null; }

function requestClose(){
  if (!T) return;
  if (T.done) return closeTest();
  if (T.kind === &#x27;resume&#x27;){
    ask({ title:&#x27;Save and exit?&#x27;, msg:&#x27;Your answers and remaining time are saved. You can resume from the same question.&#x27;, no:&#x27;Keep going&#x27;, yes:&#x27;Save and exit&#x27;,
      cb: () =&gt; {
        RESUME.ans = T.ans.slice(); RESUME.flag = T.flag.slice(); RESUME.idx = T.idx; RESUME.left = T.left;
        renderResume(); closeTest(); toast(&#x27;Progress saved. Resume any time.&#x27;);
      } });
    return;
  }
  if (T.ans.every(a =&gt; a == null)) return closeTest();
  ask({ title:&#x27;Leave this test?&#x27;, msg:&#x27;Your answers in this test will not be saved.&#x27;, no:&#x27;Keep going&#x27;, yes:&#x27;Leave test&#x27;, cb: closeTest });
}

function closeTest(){
  clearInterval(timerId);
  closeAsk();
  M.modal.hidden = true;
  document.body.classList.remove(&#x27;lock&#x27;);
  T = null;
  if (lastFocus &amp;&amp; lastFocus.focus) lastFocus.focus({ preventScroll:true });
}

/* ---------- finish + results ---------- */
function finish(){
  if (!T || T.done) return;
  closeAsk();
  T.done = true;
  clearInterval(timerId);
  const { c, w, s } = counts();
  const att = c + w;
  const acc = att ? Math.round(c / att * 100) : 0;
  const score = Math.round((c * 2 - (T.neg &amp;&amp; T.mode === &#x27;exam&#x27; ? w * .67 : 0)) * 100) / 100;
  T.res = { c, w, s, att, acc, score, full:T.n * 2 };

  /* update weak topic accuracy, recent attempts and stats */
  const touched = new Map();
  T.qs.forEach((Q, i) =&gt; {
    if (T.ans[i] == null) return;
    const wk = WEAK.find(x =&gt; x.subject === Q.sub &amp;&amp; x.topic === Q.top);
    if (!wk) return;
    if (!touched.has(wk)) touched.set(wk, { before:accOf(wk), c:0, n:0 });
    const t = touched.get(wk); t.n++; wk.done++;
    if (T.ans[i] === Q.k){ wk.right++; t.c++; }
  });
  T.delta = [...touched].map(([wk, t]) =&gt; ({ name:`${wk.subject}: ${wk.topic}`, before:t.before, after:accOf(wk), p:planFor(accOf(wk)), c:t.c, n:t.n }));
  WEAK.sort((a, b) =&gt; accOf(a) - accOf(b));

  testsTaken++;
  RECENT.unshift({ t:T.title, d:&#x27;Just now&#x27;, s: T.mode === &#x27;exam&#x27; ? `${score}/${T.n * 2}` : `${c}/${T.n}`, a:acc });
  RECENT.length = Math.min(RECENT.length, 5);
  if (T.kind === &#x27;resume&#x27;) RESUME = null;
  renderWeak(); renderPresets(); renderRecent(); renderResume();

  renderResult();
}

function renderResult(){
  const R = T.res, exam = T.mode === &#x27;exam&#x27;, L = &#x27;ABCD&#x27;;
  M.wrap.classList.add(&#x27;result&#x27;);
  $(&#x27;#mProg&#x27;).style.width = &#x27;100%&#x27;;
  $(&#x27;#mTimer&#x27;).classList.remove(&#x27;low&#x27;);
  $(&#x27;#mTimeLbl&#x27;).textContent = &#x27;Taken&#x27;;
  $(&#x27;#mTime&#x27;).textContent = fmt(T.elapsed);

  const head = R.acc &gt;= 80 ? &#x27;Strong round&#x27; : R.acc &gt;= 60 ? &#x27;Good progress&#x27; : &#x27;Worth another pass&#x27;;
  const msg = R.att ? `You got ${R.c} of ${R.att} attempted questions right.` : &#x27;You did not attempt any questions.&#x27;;

  let h = `&lt;div class=&quot;res&quot;&gt;&lt;div class=&quot;res-hero&quot;&gt;&lt;span class=&quot;ring&quot; style=&quot;--v:${R.acc};--c:${accCol(R.acc)}&quot;&gt;&lt;b&gt;${R.acc}%&lt;/b&gt;&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${head}&lt;/h3&gt;&lt;p&gt;${msg}${exam ? ` Score ${R.score} out of ${R.full}.` : &#x27;&#x27;}&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`;
  h += `&lt;div class=&quot;tiles&quot;&gt;&lt;div class=&quot;tile g&quot;&gt;&lt;small&gt;Correct&lt;/small&gt;&lt;b&gt;${R.c}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;tile r&quot;&gt;&lt;small&gt;Wrong&lt;/small&gt;&lt;b&gt;${R.w}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;small&gt;Skipped&lt;/small&gt;&lt;b&gt;${R.s}&lt;/b&gt;&lt;/div&gt;&lt;div class=&quot;tile&quot;&gt;&lt;small&gt;${exam ? &#x27;Score&#x27; : &#x27;Time taken&#x27;}&lt;/small&gt;&lt;b&gt;${exam ? R.score : fmt(T.elapsed)}&lt;/b&gt;&lt;/div&gt;&lt;/div&gt;`;

  if (T.delta.length){
    h += `&lt;div&gt;&lt;h4&gt;How your weak areas moved&lt;/h4&gt;` + T.delta.map(d =&gt; {
      const up = d.after &gt;= d.before;
      return `&lt;div class=&quot;delta&quot;&gt;&lt;b&gt;${esc(d.name)}&lt;/b&gt;&lt;span class=&quot;arrow ${up ? &#x27;up&#x27; : &#x27;dn&#x27;}&quot;&gt;${d.before}% to ${d.after}%&lt;/span&gt;&lt;small&gt;${d.c} of ${d.n} right in this test. Your next booster starts in &lt;b&gt;${d.p.name}&lt;/b&gt; mode.&lt;/small&gt;&lt;/div&gt;`;
    }).join(&#x27;&#x27;) + `&lt;/div&gt;`;
  }

  h += `&lt;div class=&quot;rev&quot;&gt;&lt;h4&gt;Review your answers&lt;/h4&gt;` + T.qs.map((Q, i) =&gt; {
    const a = T.ans[i], st = a == null ? &#x27;sk&#x27; : a === Q.k ? &#x27;ok&#x27; : &#x27;no&#x27;;
    const ic = st === &#x27;ok&#x27; ? &#x27;check&#x27; : st === &#x27;no&#x27; ? &#x27;x&#x27; : &#x27;pause&#x27;;
    let body = `&lt;p&gt;${esc(Q.t)}&lt;/p&gt;`;
    if (Q.s) body += `&lt;p&gt;${Q.s.map((x, j) =&gt; `${j + 1}. ${esc(x)}`).join(&#x27;&lt;br&gt;&#x27;)}&lt;/p&gt;&lt;p&gt;${esc(Q.a)}&lt;/p&gt;`;
    body += `&lt;p&gt;&lt;em&gt;Your answer:&lt;/em&gt; ${a == null ? &#x27;Skipped&#x27; : L[a] + &#x27;. &#x27; + esc(Q.o[a])}&lt;/p&gt;&lt;p&gt;&lt;em&gt;Correct answer:&lt;/em&gt; ${L[Q.k]}. ${esc(Q.o[Q.k])}&lt;/p&gt;&lt;p&gt;${esc(Q.e)}&lt;/p&gt;`;
    return `&lt;details&gt;&lt;summary&gt;&lt;span class=&quot;st ${st}&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-${ic}&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;span class=&quot;t&quot;&gt;${i + 1}. ${esc(Q.t)}&lt;/span&gt;&lt;svg class=&quot;ic&quot; style=&quot;width:16px;height:16px;color:var(--faint)&quot;&gt;&lt;use href=&quot;#i-chev&quot;/&gt;&lt;/svg&gt;&lt;/summary&gt;&lt;div class=&quot;rb&quot;&gt;${body}&lt;/div&gt;&lt;/details&gt;`;
  }).join(&#x27;&#x27;) + `&lt;/div&gt;&lt;/div&gt;`;
  M.main.innerHTML = h;
  M.main.scrollTop = 0;

  const wrong = T.qs.filter((Q, i) =&gt; T.ans[i] !== Q.k);
  let f = `&lt;button class=&quot;mb ghost&quot; data-act=&quot;close&quot;&gt;Close&lt;/button&gt;&lt;span class=&quot;grow&quot;&gt;&lt;/span&gt;`;
  if (wrong.length) f += `&lt;button class=&quot;mb ghost&quot; data-act=&quot;retry&quot;&gt;Retry ${wrong.length === 1 ? &#x27;the mistake&#x27; : &#x27;mistakes and skips&#x27;}&lt;/button&gt;`;
  if (T.again) f += `&lt;button class=&quot;mb solid&quot; data-act=&quot;again&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-reset&quot;/&gt;&lt;/svg&gt;${T.kind === &#x27;custom&#x27; ? &#x27;New test&#x27; : &#x27;Practise again&#x27;}&lt;/button&gt;`;
  M.foot.innerHTML = f;
  M.modal.querySelector(&#x27;#mMain&#x27;).focus?.();

  if (T.delta[0]) toast(`${T.delta[0].name.split(&#x27;: &#x27;)[1]} accuracy is now ${T.delta[0].after}%`);
}

/* ---------- popup events ---------- */
M.main.addEventListener(&#x27;click&#x27;, e =&gt; { const b = e.target.closest(&#x27;[data-opt]&#x27;); if (b &amp;&amp; b.getAttribute(&#x27;aria-disabled&#x27;) !== &#x27;true&#x27;) pick(+b.dataset.opt); });
M.side.addEventListener(&#x27;click&#x27;, e =&gt; { const b = e.target.closest(&#x27;[data-go]&#x27;); if (b) go(+b.dataset.go); });
M.foot.addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-act]&#x27;); if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === &#x27;prev&#x27;) go(T.idx - 1);
  else if (a === &#x27;next&#x27;) next();
  else if (a === &#x27;flag&#x27;){ T.flag[T.idx] = !T.flag[T.idx]; renderTest(); }
  else if (a === &#x27;clear&#x27;){ T.ans[T.idx] = null; renderTest(); }
  else if (a === &#x27;close&#x27;) closeTest();
  else if (a === &#x27;again&#x27;){ const fn = T.again; closeTest(); fn(); }
  else if (a === &#x27;retry&#x27;){
    const wrong = T.qs.filter((Q, i) =&gt; T.ans[i] !== Q.k);
    const title = T.title;
    closeTest();
    startTest({ kind:&#x27;retry&#x27;, title:&#x27;Retry: &#x27; + title, sub:&#x27;Only the questions you missed, with instant answers&#x27;, qs:wrong, mode:&#x27;learn&#x27;, neg:false, plan:null });
  }
});
$(&#x27;#mClose&#x27;).addEventListener(&#x27;click&#x27;, requestClose);
$(&#x27;#mBack&#x27;).addEventListener(&#x27;click&#x27;, requestClose);
$(&#x27;#cNo&#x27;).addEventListener(&#x27;click&#x27;, closeAsk);
$(&#x27;#cYes&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { const cb = confirmCb; closeAsk(); if (cb) cb(); });

document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
  if (M.modal.hidden) return;
  if (e.key === &#x27;Escape&#x27;){ e.preventDefault(); if (!M.conf.hidden) closeAsk(); else requestClose(); return; }
  if (e.key === &#x27;Tab&#x27;){                     /* keep focus inside the popup */
    const f = [...M.modal.querySelectorAll(&#x27;button:not([disabled]),summary,[tabindex=&quot;-1&quot;]#qText&#x27;)].filter(x =&gt; x.offsetParent !== null &amp;&amp; !(M.conf.hidden === false &amp;&amp; !M.conf.contains(x)));
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey &amp;&amp; document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey &amp;&amp; document.activeElement === last){ e.preventDefault(); first.focus(); }
    return;
  }
  if (!T || T.done || !M.conf.hidden) return;
  const k = e.key.toLowerCase();
  if (/^[1-4]$/.test(k)) pick(+k - 1);
  else if (/^[a-d]$/.test(k) &amp;&amp; !e.ctrlKey &amp;&amp; !e.metaKey) pick(&#x27;abcd&#x27;.indexOf(k));
  else if (e.key === &#x27;ArrowRight&#x27;) next();
  else if (e.key === &#x27;ArrowLeft&#x27;) go(T.idx - 1);
});

/* ============================================================
   STATIC SECTIONS
   ============================================================ */
function renderPresets(){
  const mini = WEAK.map(w =&gt; {
    const p = accOf(w);
    return `&lt;span class=&quot;mrow&quot;&gt;&lt;span&gt;${w.topic}&lt;/span&gt;&lt;span class=&quot;mbar&quot;&gt;&lt;i style=&quot;width:${p}%;background:${accCol(p)}&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;em&gt;${p}%&lt;/em&gt;&lt;/span&gt;`;
  }).join(&#x27;&#x27;);
  const subjects = [...new Set(WEAK.map(w =&gt; w.subject))].slice(0, 5);
  const chips = subjects.map(s =&gt; `&lt;span class=&quot;subj-chip&quot;&gt;${s}&lt;/span&gt;`).join(&#x27;&#x27;);
  $(&#x27;#presets&#x27;).innerHTML = `
  &lt;button class=&quot;preset booster&quot; data-booster&gt;
    &lt;span class=&quot;bt&quot;&gt;
      &lt;span class=&quot;pi b&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-target&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;span class=&quot;bt-text&quot;&gt;&lt;b&gt;Weak area booster&lt;/b&gt;&lt;small&gt;Opens a test built from your weakest topics. The lower your accuracy, the more questions and the gentler the start.&lt;/small&gt;&lt;/span&gt;
      &lt;span class=&quot;b-badge&quot;&gt;Adapts to your accuracy&lt;/span&gt;
    &lt;/span&gt;
    &lt;span class=&quot;subj-chips&quot;&gt;${chips}&lt;/span&gt;
    &lt;span class=&quot;mini&quot;&gt;${mini}&lt;/span&gt;
    &lt;span class=&quot;b-cta&quot;&gt;&lt;svg class=&quot;ic fill&quot;&gt;&lt;use href=&quot;#i-play&quot;/&gt;&lt;/svg&gt;Start now&lt;/span&gt;
  &lt;/button&gt;` + PRESETS.map((p, i) =&gt; `
  &lt;button class=&quot;preset&quot; data-preset=&quot;${i}&quot;&gt;
    &lt;span class=&quot;pi ${p.cls}&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-${p.icon}&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
    &lt;span&gt;&lt;b&gt;${p.t}&lt;/b&gt;&lt;small&gt;${p.s}&lt;/small&gt;&lt;/span&gt;
  &lt;/button&gt;`).join(&#x27;&#x27;);
}

function renderWeak(){
  $(&#x27;#weak&#x27;).innerHTML = WEAK.map((w, i) =&gt; {
    const pct = accOf(w), pl = planFor(pct);
    return `&lt;li&gt;&lt;button class=&quot;wk&quot; data-weak=&quot;${i}&quot; aria-label=&quot;Start ${w.topic} booster, ${pct}% accuracy&quot;&gt;
      &lt;span class=&quot;ring&quot; style=&quot;--v:${pct};--c:${accCol(pct)}&quot;&gt;&lt;b&gt;${pct}%&lt;/b&gt;&lt;/span&gt;
      &lt;span&gt;&lt;b&gt;${w.subject}: ${w.topic}&lt;/b&gt;&lt;small&gt;${w.right} of ${w.done} correct&lt;/small&gt;&lt;/span&gt;
      &lt;span class=&quot;wk-r&quot;&gt;&lt;span class=&quot;plan ${pl.key}&quot;&gt;${pl.name}&lt;/span&gt;&lt;span class=&quot;go&quot;&gt;&lt;svg class=&quot;ic fill&quot; style=&quot;width:12px;height:12px&quot;&gt;&lt;use href=&quot;#i-play&quot;/&gt;&lt;/svg&gt;Start&lt;/span&gt;&lt;/span&gt;
    &lt;/button&gt;&lt;/li&gt;`;
  }).join(&#x27;&#x27;);
}

function renderRecent(){
  $(&#x27;#recent&#x27;).innerHTML = RECENT.map(r =&gt; {
    const cls = r.a &gt;= 70 ? &#x27;good&#x27; : r.a &gt;= 55 ? &#x27;mid&#x27; : &#x27;low&#x27;;
    return `&lt;li&gt;
      &lt;div&gt;&lt;b&gt;${esc(r.t)}&lt;/b&gt;&lt;small&gt;${r.d}&lt;/small&gt;&lt;/div&gt;
      &lt;div class=&quot;score&quot;&gt;${r.s}&lt;/div&gt;
      &lt;span class=&quot;acc ${cls}&quot;&gt;${r.a}%&lt;/span&gt;
    &lt;/li&gt;`;
  }).join(&#x27;&#x27;);
}

function renderResume(){
  const sec = $(&#x27;#resume&#x27;);
  if (!RESUME){ sec.hidden = true; return; }
  sec.hidden = false;
  const n = RESUME.ids.length, done = RESUME.ans.filter(a =&gt; a != null).length;
  const pct = Math.round(done / n * 100), mins = Math.ceil(RESUME.left / 60);
  $(&#x27;#resSub&#x27;).textContent = `${RESUME.top}: ${done} of ${n} answered, ${mins} minutes left`;
  $(&#x27;#resRing&#x27;).style.setProperty(&#x27;--v&#x27;, pct);
  $(&#x27;#resPct&#x27;).textContent = pct + &#x27;%&#x27;;
  $(&#x27;#resBar&#x27;).setAttribute(&#x27;aria-valuenow&#x27;, pct);
  $(&#x27;#resBar&#x27;).firstElementChild.style.width = pct + &#x27;%&#x27;;
}

function renderCoverage(){
  $(&#x27;#cov&#x27;).innerHTML = Object.entries(COVER).map(([sub, topics]) =&gt; `
  &lt;div class=&quot;cov-row&quot;&gt;&lt;span&gt;${sub}&lt;/span&gt;&lt;div class=&quot;cells&quot;&gt;
    ${Object.entries(topics).map(([top, p]) =&gt; `
      &lt;button class=&quot;cell${p === 0 ? &#x27; zero&#x27; : &#x27;&#x27;}&quot; style=&quot;--p:${p}&quot; data-sub=&quot;${sub}&quot; data-top=&quot;${top}&quot;&gt;
        &lt;b&gt;${top}&lt;/b&gt;&lt;small&gt;${p === 0 ? &#x27;Not started&#x27; : p + &#x27;% attempted&#x27;}&lt;/small&gt;
      &lt;/button&gt;`).join(&#x27;&#x27;)}
  &lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
  const all = Object.values(COVER).flatMap(o =&gt; Object.values(o));
  const avg = Math.round(all.reduce((a, b) =&gt; a + b, 0) / all.length);
  $(&#x27;#covRing&#x27;).style.setProperty(&#x27;--v&#x27;, avg);
  $(&#x27;#covPct&#x27;).textContent = avg + &#x27;%&#x27;;
}

WEAK.sort((a, b) =&gt; accOf(a) - accOf(b));
renderPresets(); renderWeak(); renderRecent(); renderResume(); renderCoverage();


/* ============================================================
   EVENTS
   ============================================================ */
document.querySelectorAll(&#x27;select[data-key]&#x27;).forEach(el =&gt; el.addEventListener(&#x27;change&#x27;, () =&gt; set(el.dataset.key, el.value)));
document.querySelectorAll(&#x27;button[data-key][data-val]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; set(b.dataset.key, b.dataset.val)));
document.querySelectorAll(&#x27;[role=switch]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; set(b.dataset.key, !S[b.dataset.key])));

$(&#x27;#presets&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  if (e.target.closest(&#x27;.b-badge&#x27;)) return;
  if (e.target.closest(&#x27;[data-booster]&#x27;)) return launchBooster(WEAK.slice());
  const b = e.target.closest(&#x27;[data-preset]&#x27;); if (!b) return;
  const p = PRESETS[+b.dataset.preset];
  apply(p.cfg, `${p.t} is ready. Check the preview, then start.`);
});

/* PRO modal */
document.querySelectorAll(&#x27;[data-open-pro]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, e =&gt; {
  e.preventDefault();
  $(&#x27;#proModal&#x27;).hidden = false;
}));
document.querySelectorAll(&#x27;[data-close-pro]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; {
  $(&#x27;#proModal&#x27;).hidden = true;
}));
document.querySelectorAll(&#x27;.pro-plan&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; {
  document.querySelectorAll(&#x27;.pro-plan&#x27;).forEach(x =&gt; x.classList.remove(&#x27;active&#x27;));
  b.classList.add(&#x27;active&#x27;);
}));
document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
  if (e.key === &#x27;Escape&#x27; &amp;&amp; !$(&#x27;#proModal&#x27;).hidden) $(&#x27;#proModal&#x27;).hidden = true;
});
$(&#x27;#weak&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-weak]&#x27;); if (!b) return;
  launchBooster([WEAK[+b.dataset.weak]]);
});
$(&#x27;#boostAll&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; launchBooster(WEAK.slice()));
$(&#x27;#cov&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-sub]&#x27;); if (!b) return;
  apply({ subject: b.dataset.sub, topic: b.dataset.top, size: 20 }, `Loaded ${b.dataset.top}. Check the preview, then start.`);
});

$(&#x27;#resetBtn&#x27;).addEventListener(&#x27;click&#x27;, resetFilters);
$(&#x27;#warnReset&#x27;).addEventListener(&#x27;click&#x27;, resetFilters);
$(&#x27;#start&#x27;).addEventListener(&#x27;click&#x27;, launchBuilder);
$(&#x27;#resumeBtn&#x27;).addEventListener(&#x27;click&#x27;, launchResume);

render();

&lt;/script&gt;

.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.timebox{background:var(--indigo-soft);border:1px solid #d3d6ff;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-top:6px}
.timebox .ti{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--indigo);display:grid;place-items:center;flex:none}
.timebox b{display:block;font-size:15px}
.timebox small{color:var(--muted);font-size:13px}

.count-line{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#fbfbfe;border:1px solid var(--line);border-radius:12px;margin-top:6px}
.count-line b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.count-line span{color:var(--muted);font-size:13.5px}
.foot{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.btn{height:46px;padding:0 22px;border-radius:11px;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:15px}
.btn.ghost{background:#f0f1f8;color:#3a425a}
.btn.ghost:hover{background:#e6e8f4}
.btn.solid{background:var(--grad);color:#fff;box-shadow:0 12px 24px -12px rgba(217,36,58,.7)}
.btn.solid:hover{filter:brightness(1.08)}
.btn.solid:disabled{background:#cfd3e2;color:#8b93a8;box-shadow:none;cursor:not-allowed}

/* ================= SCREEN 2: test taking ================= */
.testbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px}
.testbar .row{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:20px}
.tb-title{font-weight:700;font-size:15px;flex:1;min-width:0}
.tb-title small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.timer{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;background:#f0f1f8;padding:8px 16px;border-radius:10px}
.timer.warn{background:#fdebec;color:#c73338}
.timer .ic{width:18px;height:18px}
.tb-prog{flex:1;max-width:200px}
.tb-prog .bar{height:6px;background:#eceef6;border-radius:3px;overflow:hidden}
.tb-prog .bar i{display:block;height:100%;background:var(--indigo);border-radius:3px}
.tb-prog small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
.lang-tg{height:34px;padding:0 14px;border-radius:9px;border:1.5px solid var(--indigo);color:var(--indigo);font-weight:800;font-size:13px;background:var(--card);flex:none}
.lang-tg[aria-pressed=&quot;true&quot;]{background:var(--indigo);color:#fff}

.qwrap{max-width:760px;margin:24px auto 0;padding:0 20px 90px;touch-action:pan-y}
.qnum{font-size:13px;font-weight:700;color:var(--indigo);margin-bottom:10px}
.qtext{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:22px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);text-align:left}
.opt:hover{border-color:#b9b4ff}
.opt[aria-pressed=&quot;true&quot;]{border-color:var(--indigo);background:var(--indigo-soft)}
.opt .let{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.opt[aria-pressed=&quot;true&quot;] .let{background:var(--indigo);border-color:var(--indigo);color:#fff}
.qnav{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.qnav .mid{display:flex;gap:8px}
.mk{height:38px;padding:0 14px;border-radius:9px;font-size:13.5px;font-weight:600;border:1px solid var(--line);background:#fff}
.mk:hover{border-color:var(--indigo)}
.mk.on{background:#fff3d9;border-color:#e8a317;color:#8a5a00}

.jumpstrip{max-width:760px;margin:0 auto 4px;padding:0 20px;display:flex;flex-wrap:wrap;gap:6px}
.jd{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted)}
.jd.cur{border-color:var(--indigo);color:var(--indigo)}
.jd.done{background:var(--indigo);border-color:var(--indigo);color:#fff}
.jd.flag{box-shadow:inset 0 0 0 2px #e8a317}

.submitbar{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:center;gap:16px;align-items:center;z-index:40}
.submitbar span{color:#c9d1e6;font-size:13.5px}

.sw-overlay{position:fixed;inset:0;background:rgba(15,18,35,.55);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:90;padding:20px}
@keyframes swpop{from{opacity:0;transform:translateY(16px) scale(.975)}to{opacity:1;transform:none}}
.sw-card{width:min(420px,100%);background:var(--card);border-radius:20px;padding:26px 24px 22px;text-align:center;box-shadow:0 30px 70px -24px rgba(0,0,0,.5);animation:swpop .2s cubic-bezier(.2,.8,.2,1)}
.sw-ic{width:48px;height:48px;border-radius:50%;background:#fdebec;color:#c73338;display:grid;place-items:center;margin:0 auto 14px}
.sw-card h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.sw-card p{color:var(--muted);font-size:13.5px;margin-top:6px}
.sw-nums{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;max-height:110px;overflow:auto}
.sw-nums button{width:32px;height:32px;border-radius:8px;border:1px solid #f0c9cb;background:#fdebec;color:#c73338;font-size:12.5px;font-weight:700}
.sw-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.sw-actions .btn{width:100%;justify-content:center}
/* ================= SCREEN 3: results ================= */
.score-hero{background:var(--navy);color:#fff;border-radius:20px;padding:30px 30px;display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.ring{width:120px;height:120px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:26px;font-weight:800}
.ring small{font-size:11px;color:#aab4d0}
.score-info{flex:1;min-width:240px}
.score-info h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.score-info p{color:#aab4d0;font-size:14px;margin-top:4px}
.score-stats{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.score-stats div b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.score-stats div small{color:#aab4d0;font-size:12.5px}

.rev-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px;flex-wrap:wrap;gap:10px}
.rev-head h2{font-size:18px;font-weight:800}
.filterbar{display:flex;gap:8px}
.fchip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.fchip[aria-pressed=&quot;true&quot;]{background:var(--navy);border-color:var(--navy);color:#fff}

.rev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:14px}
.rev-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
.rev-top .qnum{margin:0}
.tagset{display:flex;gap:6px}
.tg{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.tg.correct{background:#e5f6ee;color:#17784f}
.tg.wrong{background:#fde8e9;color:#b32a30}
.tg.skip{background:#f0f1f8;color:#5f6880}
.rev .qtext{font-size:15.5px;margin-bottom:14px}
.rev-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:6px}
.rev-opt .let{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;border:1.5px solid var(--line)}
.rev-opt.right{background:#e5f6ee}
.rev-opt.right .let{background:var(--easy);border-color:var(--easy);color:#fff}
.rev-opt.picked-wrong{background:#fde8e9}
.rev-opt.picked-wrong .let{background:var(--hard);border-color:var(--hard);color:#fff}
.expl{background:#f7f8fc;border-radius:10px;padding:12px 14px;font-size:13.5px;color:#3a425a;margin-top:10px;line-height:1.55}
.expl b{color:var(--text)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;font-weight:600;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .choice{grid-template-columns:minmax(0,1fr)}
  .choice-card.stat{flex-direction:column;align-items:flex-start}
  .choice-card.stat .choice-arrow{margin-left:0}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .yearGrid{grid-template-columns:repeat(4,1fr)}
  .pyq-subj-row{grid-template-columns:82px minmax(0,1fr) 34px;gap:8px}
  .pyq-trow{grid-template-columns:minmax(0,1fr) 40px 60px;gap:6px;font-size:12.5px}
  .pyq-practice{padding:0 8px;font-size:11px}
  .pyq-topic-head{flex-direction:column;align-items:stretch}
  .a-filter-row{flex-direction:column;align-items:stretch;gap:14px}
  .a-exam-col{flex:none}
  .a-year-col{flex:none}
  .testbar .row{flex-wrap:wrap}
  .tb-prog{order:3;max-width:none;width:100%}
  .score-hero{flex-direction:column;text-align:center}
  .score-stats{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

&lt;!-- ============ SCREEN 0: choice ============ --&gt;
&lt;section id=&quot;scr-choice&quot; class=&quot;wrap narrow&quot;&gt;
  &lt;div class=&quot;intro&quot;&gt;
    &lt;h1&gt;How do you want to practise?&lt;/h1&gt;
    &lt;p&gt;Pick a year to relive a full past paper, or build a set from any subject and topic. Both are timed like the real exam.&lt;/p&gt;
  &lt;/div&gt;
  &lt;div class=&quot;choice&quot;&gt;
    &lt;button class=&quot;choice-card year&quot; data-go=&quot;year&quot;&gt;
      &lt;span class=&quot;ch-ic&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-cal&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;h2&gt;Year-wise&lt;/h2&gt;
      &lt;p&gt;Solve every question from one year&#x27;s paper, in order, as it actually appeared.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-check&quot;/&gt;&lt;/svg&gt;Pick a year and exam&lt;/li&gt;
        &lt;li&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-check&quot;/&gt;&lt;/svg&gt;Full original paper, no filtering&lt;/li&gt;
      &lt;/ul&gt;
      &lt;span class=&quot;choice-arrow&quot;&gt;Start year-wise &lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-arrow-r&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
    &lt;/button&gt;
    &lt;button class=&quot;choice-card subj&quot; data-go=&quot;subject&quot;&gt;
      &lt;span class=&quot;ch-ic&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-layers&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;h2&gt;Subject-wise&lt;/h2&gt;
      &lt;p&gt;Choose a subject and topic. Every matching question from every year is pulled in — no limit.&lt;/p&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-check&quot;/&gt;&lt;/svg&gt;Subject, topic and subtopic filters&lt;/li&gt;
        &lt;li&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-check&quot;/&gt;&lt;/svg&gt;Optionally narrow by year&lt;/li&gt;
      &lt;/ul&gt;
      &lt;span class=&quot;choice-arrow&quot;&gt;Start subject-wise &lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-arrow-r&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
    &lt;/button&gt;
    &lt;button class=&quot;choice-card stat&quot; data-go=&quot;analysis&quot;&gt;
      &lt;span class=&quot;ch-ic&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-bars&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;div class=&quot;stat-txt&quot;&gt;
        &lt;h2&gt;PYQ frequency analysis&lt;/h2&gt;
        &lt;p&gt;How many past-year questions exist for each subject and topic in the bank.&lt;/p&gt;
      &lt;/div&gt;
      &lt;span class=&quot;choice-arrow&quot;&gt;View analysis &lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-arrow-r&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
    &lt;/button&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;!-- ============ SCREEN 1a: year-wise filters ============ --&gt;
&lt;section id=&quot;scr-year&quot; class=&quot;wrap narrow&quot; hidden&gt;
  &lt;button class=&quot;back&quot; data-go=&quot;choice&quot;&gt;&lt;svg class=&quot;ic&quot; style=&quot;width:15px;height:15px&quot;&gt;&lt;use href=&quot;#i-arrow-l&quot;/&gt;&lt;/svg&gt;Change practice mode&lt;/button&gt;
  &lt;div class=&quot;panel&quot;&gt;
    &lt;div class=&quot;panel-head&quot;&gt;
      &lt;span class=&quot;ph-ic year&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-cal&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;div&gt;&lt;h2&gt;Year-wise Analysis&lt;/h2&gt;&lt;p&gt;Pick the exam and year. Every question from that paper is included.&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;field&quot;&gt;
      &lt;span class=&quot;lbl&quot;&gt;Exam&lt;/span&gt;
      &lt;div class=&quot;chips&quot; id=&quot;y-exam&quot;&gt;
        &lt;button class=&quot;chip&quot; data-val=&quot;prelims&quot; aria-pressed=&quot;true&quot;&gt;UPSC Prelims&lt;/button&gt;
        &lt;button class=&quot;chip&quot; data-val=&quot;pcs&quot; aria-pressed=&quot;false&quot;&gt;State PCS&lt;/button&gt;
        &lt;button class=&quot;chip&quot; data-val=&quot;cds&quot; aria-pressed=&quot;false&quot;&gt;CDS&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;field&quot;&gt;
      &lt;span class=&quot;lbl&quot;&gt;Year&lt;/span&gt;
      &lt;div class=&quot;yearGrid&quot; id=&quot;y-year&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;count-line&quot;&gt;&lt;span&gt;Questions in this paper&lt;/span&gt;&lt;b id=&quot;y-count&quot;&gt;100&lt;/b&gt;&lt;/div&gt;
    &lt;div class=&quot;timebox&quot;&gt;
      &lt;span class=&quot;ti&quot;&gt;&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-clock&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;
      &lt;div&gt;&lt;b id=&quot;y-time&quot;&gt;120 minutes for the full paper&lt;/b&gt;&lt;small&gt;One overall timer for the whole set, same as the real exam&lt;/small&gt;&lt;/div&gt;
    &lt;/div&gt;
