/* ---------- PYQ frequency analysis screen ---------- */
const aState = { exam:&#x27;all&#x27;, year:&#x27;all&#x27; };
function aFactor(){
  const examF = aState.exam===&#x27;all&#x27; ? 1 : EXAM_WEIGHT[aState.exam];
  const yearF = aState.year===&#x27;all&#x27; ? 1 : 0.18;
  return examF * yearF;
}
function aLabel(){
  const examTxt = aState.exam===&#x27;all&#x27; ? &#x27;all exams&#x27; : EXAM_LABEL[aState.exam];
  const yearTxt = aState.year===&#x27;all&#x27; ? &#x27;all years&#x27; : aState.year;
  return `${examTxt}, ${yearTxt}`;
}
$(&#x27;#a-year&#x27;).innerHTML += YEARS.map(y =&gt; `&lt;option value=&quot;${y}&quot;&gt;${y}&lt;/option&gt;`).join(&#x27;&#x27;);
function pyqSubjectTotalRaw(sub){
  return Object.values(BANK[sub]).reduce((sum, subs) =&gt;
    sum + Object.values(subs).reduce((s2, c) =&gt; s2 + c, 0), 0);
}
function pyqSubjectTotal(sub){
  return Math.max(0, Math.round(pyqSubjectTotalRaw(sub) * aFactor()));
}
/* Deterministic per-topic trend bias (demo only, no real year-wise PYQ data behind it):
   hashes the topic+subtopic name into a factor so the same topic always trends the same way. */
function strHash(s){ let h=0; for (let i=0;i&lt;s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return h; }
function topicTrend(key){ return ((strHash(key)%200)-100)/100 * 0.35; }
function yearRecency(y){ const i = YEARS.indexOf(y); return (2.5-i)/2.5; }
function topicYearCount(key, c, y, examF){
  const t = topicTrend(key);
  return Math.max(0, c*examF*0.18*(1+t*yearRecency(y)));
}
let pyqSubject = Object.keys(BANK)[0];
function renderPyqSubjects(){
  const totals = Object.keys(BANK).map(sub =&gt; ({ sub, n: pyqSubjectTotal(sub) }));
  const max = Math.max(1, ...totals.map(t =&gt; t.n));
  $(&#x27;#pyqSubjects&#x27;).innerHTML = totals.map(({sub, n}) =&gt; `
    &lt;button class=&quot;pyq-subj-row&quot; data-sub=&quot;${sub}&quot; aria-pressed=&quot;${sub===pyqSubject}&quot;&gt;
      &lt;b&gt;${sub}&lt;/b&gt;
      &lt;span class=&quot;pyq-bar&quot;&gt;&lt;i style=&quot;width:${Math.round(n/max*100)}%&quot;&gt;&lt;/i&gt;&lt;/span&gt;
      &lt;span class=&quot;cnt&quot;&gt;${n}&lt;/span&gt;
    &lt;/button&gt;`).join(&#x27;&#x27;);
}
function renderPyqTopics(){
  $(&#x27;#pyqTopicH&#x27;).textContent = `${pyqSubject} \u2014 topic-wise breakdown`;
  const topics = BANK[pyqSubject];
  const f = aFactor();
  let rows = [];
  for (const [top, subs] of Object.entries(topics)){
    for (const [st, c] of Object.entries(subs)) rows.push({ top, st, n: Math.round(c*f) });
  }
  rows.sort((a,b) =&gt; b.n - a.n);
  if (!rows.length || rows.every(r =&gt; r.n===0)){
    $(&#x27;#pyqTopics&#x27;).innerHTML = &#x27;&lt;p class=&quot;pyq-empty&quot;&gt;No questions match this exam/year combination.&lt;/p&gt;&#x27;;
    return;
  }
  $(&#x27;#pyqTopics&#x27;).innerHTML = rows.map(r =&gt; `
    &lt;div class=&quot;pyq-trow&quot;&gt;
      &lt;span class=&quot;tname&quot;&gt;${r.top}&lt;span class=&quot;sname&quot;&gt;${r.st}&lt;/span&gt;&lt;/span&gt;
      &lt;span class=&quot;cnt&quot;&gt;${r.n}&lt;small&gt;Qs&lt;/small&gt;&lt;/span&gt;
      &lt;button class=&quot;pyq-practice&quot; data-sub=&quot;${pyqSubject}&quot; data-top=&quot;${r.top}&quot; data-st=&quot;${r.st}&quot; ${r.n===0?&#x27;disabled&#x27;:&#x27;&#x27;}&gt;Practice&lt;/button&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;);
}
function renderAuSummary(){ $(&#x27;#aSummary&#x27;).textContent = `Showing: ${aLabel()}`; }
function subjectYearTotal(sub, y, examF){
  let sum = 0;
  for (const [top, subs] of Object.entries(BANK[sub])){
    for (const [st, c] of Object.entries(subs)){
      sum += topicYearCount(`${sub}|${top}|${st}`, c, y, examF);
    }
  }
  return Math.round(sum);
}
const SUBJECT_COLOR = {
  Polity: &#x27;#e3f5ef&#x27;, Economy: &#x27;#eee3f5&#x27;, Geography: &#x27;#f5e9dc&#x27;, History: &#x27;#e6e6f2&#x27;
};

/* ---------- Subject-wise filter screen ---------- */
const EXAM_LABEL = { prelims:&#x27;UPSC Prelims&#x27;, pcs:&#x27;State PCS&#x27;, cds:&#x27;CDS&#x27; };
const EXAM_WEIGHT = { prelims:.55, pcs:.3, cds:.15 }; // share of each exam&#x27;s PYQs in the bank
const sState = { subject:&#x27;all&#x27;, topic:&#x27;all&#x27;, subtopic:&#x27;all&#x27;, years:[&#x27;all&#x27;], exams:[&#x27;all&#x27;], size:&#x27;all&#x27; };
function fillSelect(id, items, allLabel, value, lockedMsg){
  const el = $(id);
  const locked = !!lockedMsg;
  el.innerHTML = locked ? `&lt;option value=&quot;all&quot;&gt;${lockedMsg}&lt;/option&gt;`
    : `&lt;option value=&quot;all&quot;&gt;${allLabel}&lt;/option&gt;` + items.map(i=&gt;`&lt;option value=&quot;${i}&quot;&gt;${i}&lt;/option&gt;`).join(&#x27;&#x27;);
  el.disabled = locked;
  el.value = locked ? &#x27;all&#x27; : value;
}
function sPool(){
  let n = 0;
  const examF = sState.exams.includes(&#x27;all&#x27;) ? 1 : sState.exams.reduce((a,e)=&gt;a+EXAM_WEIGHT[e],0);
  for (const [sub, topics] of Object.entries(BANK)){
    if (sState.subject!==&#x27;all&#x27; &amp;&amp; sState.subject!==sub) continue;
    for (const [top, subs] of Object.entries(topics)){
      if (sState.topic!==&#x27;all&#x27; &amp;&amp; sState.topic!==top) continue;
      for (const [st, c] of Object.entries(subs)){
        if (sState.subtopic!==&#x27;all&#x27; &amp;&amp; sState.subtopic!==st) continue;
        const yf = sState.years.includes(&#x27;all&#x27;) ? 1 : sState.years.length*0.18;
        n += Math.round(c * yf * examF);
      }
    }
  }
  return n;
}
function chosenSize(pool){
  if (sState.size===&#x27;all&#x27;) return pool;
  if (sState.size===&#x27;custom&#x27;){
    const v = Math.floor(+$(&#x27;#s-custom&#x27;).value || 0);
    return v &gt; 0 ? Math.min(v, pool) : 0;
  }
  return Math.min(+sState.size, pool);
}
function renderSubject(){
  fillSelect(&#x27;#s-subject&#x27;, Object.keys(BANK), &#x27;All subjects&#x27;, sState.subject);
  sState.subject===&#x27;all&#x27; ? fillSelect(&#x27;#s-topic&#x27;, [], &#x27;&#x27;, &#x27;all&#x27;, &#x27;Choose a subject first&#x27;)
    : fillSelect(&#x27;#s-topic&#x27;, Object.keys(BANK[sState.subject]), &#x27;All topics&#x27;, sState.topic);
  sState.topic===&#x27;all&#x27; ? fillSelect(&#x27;#s-subtopic&#x27;, [], &#x27;&#x27;, &#x27;all&#x27;, &#x27;Choose a topic first&#x27;)
    : fillSelect(&#x27;#s-subtopic&#x27;, Object.keys(BANK[sState.subject][sState.topic]), &#x27;All subtopics&#x27;, sState.subtopic);

  const pool = sPool();
  $(&#x27;#s-count&#x27;).textContent = pool;

  $(&#x27;#s-custom&#x27;).style.display = sState.size===&#x27;custom&#x27; ? &#x27;block&#x27; : &#x27;none&#x27;;
  const n = chosenSize(pool);
  $(&#x27;#s-sizehint&#x27;).textContent =
    pool===0 ? &#x27;No matching questions yet&#x27; :
    sState.size===&#x27;all&#x27; ? `Test will include all ${pool} matching questions` :
    sState.size===&#x27;custom&#x27; ? (n&gt;0 ? `Test will include ${n} of ${pool} matching questions` : `Enter a number up to ${pool}`) :
    `Test will include ${n} of ${pool} matching questions`;

  $(&#x27;#s-time&#x27;).textContent = n ? `${timeFor(n)} minutes for ${n} questions` : &#x27;-&#x27;;
  $(&#x27;#s-startBtn&#x27;).disabled = n === 0;
}
$(&#x27;#s-subject&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { sState.subject=e.target.value; sState.topic=&#x27;all&#x27;; sState.subtopic=&#x27;all&#x27;; renderSubject(); });
$(&#x27;#s-topic&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { sState.topic=e.target.value; sState.subtopic=&#x27;all&#x27;; renderSubject(); });
$(&#x27;#s-subtopic&#x27;).addEventListener(&#x27;change&#x27;, e =&gt; { sState.subtopic=e.target.value; renderSubject(); });
$(&#x27;#s-exams&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {

$(&#x27;#s-years&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {

    sState.years.includes(v) ? sState.years = sState.years.filter(x=&gt;x!==v) : sState.years.push(v);
    if (!sState.years.length) sState.years = [&#x27;all&#x27;];

  [...$(&#x27;#s-years&#x27;).children].forEach(c =&gt; c.setAttribute(&#x27;aria-pressed&#x27;, sState.years.includes(c.dataset.val)));

$(&#x27;#s-size&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {

let session = null; // { title, sub, n, minutes, answers:[], flags:Set, i, secondsLeft }
let tickHandle = null;
let lang = &#x27;en&#x27;;

function buildQuestions(n){
  const out = [];
  for (let i=0;i&lt;n;i++) out.push({ ...SAMPLE_Q[i % SAMPLE_Q.length], id:i });
  return out;
}

function startSession(mode){
  let n, title, sub;
  if (mode===&#x27;year&#x27;){
    n = yCount();
    title = `${yState.exam===&#x27;prelims&#x27;?&#x27;UPSC Prelims&#x27;:yState.exam===&#x27;pcs&#x27;?&#x27;State PCS&#x27;:&#x27;CDS&#x27;} ${yState.year}`;
    sub = &#x27;Full paper, in order&#x27;;
  } else {
    n = chosenSize(sPool());
    if (!n) return;
    title = [sState.subject, sState.topic, sState.subtopic].filter(x=&gt;x!==&#x27;all&#x27;).join(&#x27; \u2192 &#x27;) || &#x27;All subjects&#x27;;
    const examTxt = sState.exams.includes(&#x27;all&#x27;) ? &#x27;all exams&#x27; : sState.exams.map(e=&gt;EXAM_LABEL[e]).join(&#x27;, &#x27;);
    sub = `${n} questions, ${examTxt}${sState.years.includes(&#x27;all&#x27;) ? &#x27;&#x27; : &#x27;, &#x27; + sState.years.join(&#x27;, &#x27;)}`;
  }
  session = {
    title, sub, questions: buildQuestions(n),
    answers: new Array(n).fill(null),
    flags: new Set(),
    i: 0,
    secondsLeft: timeFor(n) * 60
  };
  $(&#x27;#t-title&#x27;).innerHTML = `${title}&lt;small&gt;${sub}&lt;/small&gt;`;
  renderJump();
  renderQuestion();
  startTimer();
  show(&#x27;test&#x27;);
}
document.querySelectorAll(&#x27;[data-start]&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; startSession(b.dataset.start)));

function fmt(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,&#x27;0&#x27;)}`;
}
function startTimer(){
  clearInterval(tickHandle);
  updateTimerUI();
  tickHandle = setInterval(() =&gt; {
    session.secondsLeft--;
    if (session.secondsLeft &lt;= 0){ session.secondsLeft = 0; clearInterval(tickHandle); finishTest(&#x27;Time is up. Your test was submitted automatically.&#x27;); return; }
    updateTimerUI();
  }, 1000);
}
function updateTimerUI(){
  $(&#x27;#t-timeleft&#x27;).textContent = fmt(session.secondsLeft);
  $(&#x27;#t-timer&#x27;).classList.toggle(&#x27;warn&#x27;, session.secondsLeft &lt;= 120);
}

function renderJump(){
  $(&#x27;#t-jump&#x27;).innerHTML = session.questions.map((q,idx) =&gt; {
    let cls = &#x27;&#x27;;
    if (idx===session.i) cls=&#x27;cur&#x27;;
    else if (session.answers[idx]!==null) cls=&#x27;done&#x27;;
    if (session.flags.has(idx)) cls += &#x27; flag&#x27;;
    return `&lt;button class=&quot;jd ${cls}&quot; data-jump=&quot;${idx}&quot;&gt;${idx+1}&lt;/button&gt;`;
  }).join(&#x27;&#x27;);
}
$(&#x27;#t-jump&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-jump]&#x27;); if(!b) return;
  session.i = +b.dataset.jump; renderQuestion(); goToQuestionTop();
});
function goToQuestionTop(){
  window.scrollTo({top:0, behavior:&#x27;auto&#x27;});
}

function renderQuestion(){
  const q = session.questions[session.i];
  const useHi = lang === &#x27;hi&#x27; &amp;&amp; q.qHi;
  const qText = useHi ? q.qHi : q.q;
  const optList = useHi ? q.optsHi : q.opts;
  $(&#x27;#t-qnum&#x27;).textContent = `Question ${session.i+1} of ${session.questions.length}`;
  $(&#x27;#t-qtext&#x27;).textContent = qText;
  $(&#x27;#t-opts&#x27;).innerHTML = optList.map((o,idx) =&gt; `
    &lt;button class=&quot;opt&quot; data-opt=&quot;${idx}&quot; aria-pressed=&quot;${session.answers[session.i]===idx}&quot;&gt;
      &lt;span class=&quot;let&quot;&gt;${String.fromCharCode(65+idx)}&lt;/span&gt;&lt;span&gt;${o}&lt;/span&gt;
    &lt;/button&gt;`).join(&#x27;&#x27;);
  $(&#x27;#t-flag&#x27;).classList.toggle(&#x27;on&#x27;, session.flags.has(session.i));
  $(&#x27;#t-prev&#x27;).disabled = session.i===0;
  $(&#x27;#t-next&#x27;).textContent = session.i === session.questions.length-1 ? &#x27;&#x27; : &#x27;Next&#x27;;
  if (session.i === session.questions.length-1){ $(&#x27;#t-next&#x27;).innerHTML = &#x27;Next&lt;svg class=&quot;ic&quot;&gt;&lt;use href=&quot;#i-arrow-r&quot;/&gt;&lt;/svg&gt;&#x27;; }
  const done = session.answers.filter(a=&gt;a!==null).length;
  $(&#x27;#t-progbar&#x27;).style.width = (done/session.questions.length*100)+&#x27;%&#x27;;
  $(&#x27;#t-progtext&#x27;).textContent = `${done} of ${session.questions.length} attempted`;
  $(&#x27;#t-remaining&#x27;).textContent = `${session.questions.length-done} of ${session.questions.length} remaining`;
  renderJump();
}
$(&#x27;#t-opts&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-opt]&#x27;); if(!b) return;
  session.answers[session.i] = +b.dataset.opt;
  renderQuestion();
});
$(&#x27;#t-lang&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
  lang = lang === &#x27;en&#x27; ? &#x27;hi&#x27; : &#x27;en&#x27;;
  $(&#x27;#t-lang&#x27;).textContent = lang === &#x27;hi&#x27; ? &#x27;हिं&#x27; : &#x27;EN&#x27;;
  $(&#x27;#t-lang&#x27;).setAttribute(&#x27;aria-pressed&#x27;, lang === &#x27;hi&#x27;);
  if (session) renderQuestion();
});
$(&#x27;#t-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { if (session.i&gt;0){ session.i--; renderQuestion(); goToQuestionTop(); } });
$(&#x27;#t-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { if (session.i&lt;session.questions.length-1){ session.i++; renderQuestion(); goToQuestionTop(); } });
$(&#x27;#t-flag&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
  session.flags.has(session.i) ? session.flags.delete(session.i) : session.flags.add(session.i);
  renderQuestion();
});
$(&#x27;#t-submit&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
  const unanswered = session.answers.map((a,i)=&gt;a===null?i:null).filter(i=&gt;i!==null);
  if (unanswered.length === 0){ clearInterval(tickHandle); finishTest(); return; }
  $(&#x27;#sw-count&#x27;).textContent = unanswered.length;
  $(&#x27;#sw-nums&#x27;).innerHTML = unanswered.map(i =&gt; `&lt;button data-go-q=&quot;${i}&quot;&gt;${i+1}&lt;/button&gt;`).join(&#x27;&#x27;);
  $(&#x27;#swOverlay&#x27;).hidden = false;
});
$(&#x27;#sw-nums&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;[data-go-q]&#x27;); if(!b) return;
  session.i = +b.dataset.goQ; renderQuestion(); goToQuestionTop();
  $(&#x27;#swOverlay&#x27;).hidden = true;
});
$(&#x27;#sw-review&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { $(&#x27;#swOverlay&#x27;).hidden = true; });
$(&#x27;#sw-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
  $(&#x27;#swOverlay&#x27;).hidden = true;
  clearInterval(tickHandle);
  finishTest();
});

/* ---------- swipe to change question (mobile) ---------- */
(function(){
  const zone = $(&#x27;.qwrap&#x27;);
  if (!zone) return;
  let sx=0, sy=0, active=false;
  zone.addEventListener(&#x27;touchstart&#x27;, e =&gt; {
    if (e.target.closest(&#x27;button,select,input,a&#x27;)) { active=false; return; }
    const t = e.changedTouches[0]; sx=t.clientX; sy=t.clientY; active=true;
  }, { passive:true });
  zone.addEventListener(&#x27;touchend&#x27;, e =&gt; {
    if (!active) return; active=false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) &lt; 55 || Math.abs(dx) &lt; Math.abs(dy)*1.3) return;
    if (dx &lt; 0 &amp;&amp; session.i &lt; session.questions.length-1){ session.i++; renderQuestion(); goToQuestionTop(); }
    else if (dx &gt; 0 &amp;&amp; session.i &gt; 0){ session.i--; renderQuestion(); goToQuestionTop(); }
  }, { passive:true });
})();

/* ============================================================
   RESULTS
   ============================================================ */
function finishTest(msg){
  const qs = session.questions;
  let correct=0, wrong=0, skip=0;
  qs.forEach((q,i) =&gt; {
    if (session.answers[i]===null) skip++;
    else if (session.answers[i]===q.ans) correct++;
    else wrong++;
  });
  const total = qs.length;
  const score = correct*2 - wrong*0.67;
  const pct = Math.round(correct/total*100);
  const took = timeFor(total)*60 - session.secondsLeft;

  $(&#x27;#r-title&#x27;).textContent = session.title;
  $(&#x27;#r-sub&#x27;).textContent = msg || &#x27;Here\u2019s how you did, question by question.&#x27;;
  $(&#x27;#r-score&#x27;).textContent = `${score.toFixed(1)}/${(total*2).toFixed(0)}`;
  $(&#x27;#r-correct&#x27;).textContent = correct;
  $(&#x27;#r-wrong&#x27;).textContent = wrong;
  $(&#x27;#r-skip&#x27;).textContent = skip;
  $(&#x27;#r-time&#x27;).textContent = `${Math.round(took/60)}m`;
  $(&#x27;#r-pct&#x27;).textContent = pct+&#x27;%&#x27;;
  const circumference = 2*Math.PI*52;
  $(&#x27;#r-arc&#x27;).setAttribute(&#x27;stroke-dasharray&#x27;, circumference.toFixed(0));
  $(&#x27;#r-arc&#x27;).setAttribute(&#x27;stroke-dashoffset&#x27;, (circumference*(1-pct/100)).toFixed(0));
  $(&#x27;#r-arc&#x27;).setAttribute(&#x27;stroke&#x27;, pct&gt;=60?&#x27;#22a06b&#x27;:pct&gt;=40?&#x27;#e8a317&#x27;:&#x27;#e5484d&#x27;);

  renderReview(&#x27;all&#x27;);
  show(&#x27;result&#x27;);
}

function renderReview(filter){
  const qs = session.questions;
  const rows = qs.map((q,i) =&gt; {
    const picked = session.answers[i];
    const status = picked===null ? &#x27;skip&#x27; : picked===q.ans ? &#x27;correct&#x27; : &#x27;wrong&#x27;;
    return { i, q, picked, status, flagged: session.flags.has(i) };
  }).filter(r =&gt; filter===&#x27;all&#x27; ? true : filter===&#x27;flag&#x27; ? r.flagged : r.status===filter);

  $(&#x27;#r-list&#x27;).innerHTML = rows.length ? rows.map(r =&gt; `
    &lt;div class=&quot;rev&quot;&gt;
      &lt;div class=&quot;rev-top&quot;&gt;
        &lt;span class=&quot;qnum&quot;&gt;Question ${r.i+1}&lt;/span&gt;
        &lt;span class=&quot;tagset&quot;&gt;
          ${r.flagged?&#x27;&lt;span class=&quot;tg skip&quot;&gt;Flagged&lt;/span&gt;&#x27;:&#x27;&#x27;}
          &lt;span class=&quot;tg ${r.status}&quot;&gt;${r.status===&#x27;correct&#x27;?&#x27;Correct&#x27;:r.status===&#x27;wrong&#x27;?&#x27;Wrong&#x27;:&#x27;Skipped&#x27;}&lt;/span&gt;
        &lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;qtext&quot;&gt;${lang===&#x27;hi&#x27; &amp;&amp; r.q.qHi ? r.q.qHi : r.q.q}&lt;/div&gt;
      ${(lang===&#x27;hi&#x27; &amp;&amp; r.q.optsHi ? r.q.optsHi : r.q.opts).map((o,idx) =&gt; {
        let cls=&#x27;rev-opt&#x27;;
        if (idx===r.q.ans) cls+=&#x27; right&#x27;;
        else if (idx===r.picked) cls+=&#x27; picked-wrong&#x27;;
        return `&lt;div class=&quot;${cls}&quot;&gt;&lt;span class=&quot;let&quot;&gt;${String.fromCharCode(65+idx)}&lt;/span&gt;&lt;span&gt;${o}&lt;/span&gt;&lt;/div&gt;`;
      }).join(&#x27;&#x27;)}
      &lt;div class=&quot;expl&quot;&gt;&lt;b&gt;Explanation.&lt;/b&gt; ${lang===&#x27;hi&#x27; &amp;&amp; r.q.explHi ? r.q.explHi : r.q.expl}&lt;/div&gt;
    &lt;/div&gt;`).join(&#x27;&#x27;) : &#x27;&lt;p style=&quot;color:var(--muted);padding:20px 0&quot;&gt;Nothing to show for this filter.&lt;/p&gt;&#x27;;
}
$(&#x27;#r-filter&#x27;).addEventListener(&#x27;click&#x27;, e =&gt; {
  const b = e.target.closest(&#x27;.fchip&#x27;); if(!b) return;
  [...$(&#x27;#r-filter&#x27;).children].forEach(c=&gt;c.setAttribute(&#x27;aria-pressed&#x27;, c===b));
  renderReview(b.dataset.f);
});

&lt;/script&gt;
&lt;/body&gt;

"></iframe>

</div>

<script>
const $ = s => document.querySelector(s);
const CRUMB = { practice: 'Analyse & Practice PYQs', sim: 'PYQs Simulation' };

function goTo(key){
  if (key === 'none') return; // placeholder nav items with no page in this mock
  document.querySelectorAll('#frame-practice,#frame-sim').forEach(f => f.classList.remove('active'));
  $('#frame-' + key).classList.add('active');
  $('#crumb').textContent = CRUMB[key];
  document.querySelectorAll('.side button.nav').forEach(b => {
    b.dataset.nav === key ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current');
  });
  $('#side').classList.remove('open');
}

document.querySelectorAll('.side button.nav').forEach(b => b.addEventListener('click', () => goTo(b.dataset.nav)));

$('#menuBtn').addEventListener('click', () => {
  if (matchMedia('(max-width:900px)').matches) $('#side').classList.toggle('open');
  else $('#shell').classList.toggle('side-off');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#side').classList.remove('open'); });

/* ---------- dark mode ---------- */
const THEME_KEY = 'examplanner-theme';
let theme = localStorage.getItem(THEME_KEY) || 'light';
function applyTheme(){
  document.documentElement.setAttribute('data-theme', theme);
  $('#themeIcon').setAttribute('href', theme === 'dark' ? '#i-sun' : '#i-moon');
  document.querySelectorAll('.content iframe').forEach(f => {
    try { f.contentWindow.postMessage({ type: 'theme', value: theme }, '*'); } catch(e){}
  });
}
document.querySelectorAll('.content iframe').forEach(f => f.addEventListener('load', applyTheme));
$('#themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, theme);
  applyTheme();
});
applyTheme();
</script>
