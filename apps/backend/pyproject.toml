[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.34.0",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastapi-mail>=1.4.1",
    "google-auth>=2.56.3",
    "google-cloud-translate>=3.15.0",
    "httpx>=0.28.1",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "passlib>=1.7.4",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pypdf>=6.14.2",
    "pypdfium2>=5.12.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlmodel>=0.0.39",
    "svix>=1.24.0",
    "uvicorn>=0.52.1",
    "rapidfuzz>=3.14.5",
    "docling>=2.125.0",
    "opencv-python-headless>=4.10.0",
    "onnxruntime>=1.29.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "app"]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]

