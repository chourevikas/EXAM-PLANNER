<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Upload Exam Paper</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"], select { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 1rem; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { margin-top: 1rem; padding: 1rem; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h1>Upload Exam Paper to S3</h1>
    <form id="uploadForm">
        <div class="form-group">
            <label for="exam_name">Exam Name</label>
            <select id="exam_name" name="exam_name" required>
                <option value="upsc">UPSC</option>
                <option value="mppsc">MPPSC</option>
                <option value="mpsc">MPSC</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="year">Year</label>
            <select id="year" name="year" required>
                <!-- Add years from 2024 down to 2010 -->
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
                <option value="2018">2018</option>
                <option value="2017">2017</option>
                <option value="2016">2016</option>
                <option value="2015">2015</option>
                <option value="2014">2014</option>
                <option value="2013">2013</option>
                <option value="2012">2012</option>
                <option value="2011">2011</option>
                <option value="2010">2010</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paper_type">Paper Type</label>
            <select id="paper_type" name="paper_type">
                <option value="previous_year_question">Previous Year Question (PYQ)</option>
                <option value="mock_test">Mock Test</option>
            </select>
        </div>

        <div class="form-group">
            <label for="file">Select PDF File</label>
            <input type="file" id="file" name="file" accept="application/pdf" required>
        </div>

        <button type="submit">Upload to S3</button>
    </form>
    <div id="statusMessage" class="message"></div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const form = e.target;
        const formData = new FormData(form);
        const statusMessage = document.getElementById('statusMessage');
        
        statusMessage.style.display = 'none';
        
        try {
            // Assuming your FastAPI backend is running on localhost:8000
            const response = await fetch('http://localhost:8000/upload', {
                method: 'POST',
                body: formData,
            });
            
            const result = await response.json();
            
            if (response.ok) {
                statusMessage.textContent = 'Success! File uploaded to: ' + result.s3_path;
                statusMessage.className = 'message success';
                form.reset();
            } else {
                statusMessage.textContent = 'Error: ' + (result.detail || 'Upload failed');
                statusMessage.className = 'message error';
            }
        } catch (error) {
            statusMessage.textContent = 'Error: Could not connect to the server.';
            statusMessage.className = 'message error';
        }
        statusMessage.style.display = 'block';
    });
</script>

</body>
</html>
