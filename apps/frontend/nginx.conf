# Per-IP limit on endpoints that return answers/explanations. Guest practice needs them without a login,
# so this throttles bulk scraping of the question bank instead of blocking it outright.
limit_req_zone $binary_remote_addr zone=ep_solutions:10m rate=30r/m;

# Report-only for now: watch the browser console / reports for violations, then switch the header name to
# Content-Security-Policy. The hash covers the inline theme script in index.html; update it if that script changes.
map $host $ep_csp {
    default "default-src 'self'; script-src 'self' 'sha256-fBfhgji3UixCXToN+tqEpGiMdYm6HUDdQxN6Objrnzo=' https://clerk.examplanner.in https://*.clerk.accounts.dev https://challenges.cloudflare.com https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://clerk.examplanner.in https://*.clerk.accounts.dev https://*.cashfree.com; frame-src https://challenges.cloudflare.com https://*.cashfree.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # The host nginx (or docker-proxy) is the direct peer; take the real client IP from it so rate limits
    # and the API's X-Real-IP see the visitor, not the Docker gateway. Only trust private/loopback peers.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;
    limit_req_status 429;

    # 1. Enable Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 2. Vite hashed static assets in /assets/ (cache for 1 year, immutable)
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 3. Static public media and icons (cache for 30 days)
    location ~* \.(?:ico|svg|png|jpe?g|webp|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 4. Single Page Application entry (ensure index.html is re-validated)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # App screens stay out of search; public pages are served by the marketing site.
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy-Report-Only $ep_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # 5. Backend API Proxy
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Overwrites anything the browser sent; the Super Admin app's proxy sets its own value.
        proxy_set_header X-Client-App web;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Question detail / solution / export routes (see ep_solutions above). Inherits the headers set here.
        location ~ ^/api/v1/(questions/[0-9]+(/solution|/formatted/[a-z]+)?|exams/[^/]+/solution-(db|artifact)/[0-9]+)$ {
            limit_req zone=ep_solutions burst=30 nodelay;
            proxy_pass http://api:8000;
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
