version: '3.8'

services:
  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # You can add database and other env variables here
      - PORT=8000
    restart: unless-stopped

  web:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3005:80"
    restart: unless-stopped
