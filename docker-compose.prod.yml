version: '3.8'

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/examplanner-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/examplanner-web:latest
    ports:
      - "3000:80"
    restart: unless-stopped
