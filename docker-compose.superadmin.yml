version: '3.8'

services:
  superadmin:
    build:
      context: ./apps/superadmin
      dockerfile: Dockerfile
    container_name: examplanner_superadmin
    restart: unless-stopped
    ports:
      # Loopback only; put the restricted Super Admin host (TLS + IP allowlist/VPN) in front of it.
      - "127.0.0.1:3005:80"
