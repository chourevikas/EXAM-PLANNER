# Host nginx for examplanner.in: one domain, two front-ends.
#   - Astro marketing site (127.0.0.1:3020) serves the public, indexable pages.
#   - The React SPA (127.0.0.1:3000) serves the app; its own nginx proxies /api/ to the backend.
# Install: copy to /etc/nginx/sites-available/examplanner.in, symlink into sites-enabled,
# keep your existing certbot/TLS lines, then `nginx -t && systemctl reload nginx`.

upstream examplanner_marketing { server 127.0.0.1:3020; keepalive 16; }
upstream examplanner_app       { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    server_name examplanner.in www.examplanner.in;
    # (certbot-managed `listen 443 ssl` + certificate lines go here)

    # One canonical host for SEO.
    if ($host = www.examplanner.in) { return 301 https://examplanner.in$request_uri; }

    client_max_body_size 100M;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Marketing site (Astro) ----
    location = /               { proxy_pass http://examplanner_marketing; }
    location = /about          { proxy_pass http://examplanner_marketing; }
    location = /contact        { proxy_pass http://examplanner_marketing; }
    location = /pricing        { proxy_pass http://examplanner_marketing; }
    location = /privacy        { proxy_pass http://examplanner_marketing; }
    location = /terms          { proxy_pass http://examplanner_marketing; }
    location = /refund-policy  { proxy_pass http://examplanner_marketing; }
    location = /404            { proxy_pass http://examplanner_marketing; }
    location ^~ /exams         { proxy_pass http://examplanner_marketing; }
    location ^~ /current-affairs { proxy_pass http://examplanner_marketing; }
    location ^~ /_astro/       { proxy_pass http://examplanner_marketing; }
    location ~ ^/sitemap[a-z-]*\.xml$ { proxy_pass http://examplanner_marketing; }
    location ~ ^/(robots\.txt|site\.webmanifest|og-image\.png|favicon\.ico|favicon-32\.png|apple-touch-icon\.png|icon-(192|512)\.png|logo-96\.webp)$ {
        proxy_pass http://examplanner_marketing;
    }

    # ---- Everything else: the React app (incl. /api/ via its own nginx) ----
    location / {
        proxy_pass http://examplanner_app;
        proxy_read_timeout 120s;
    }
}
